name: Build Kernel Samsung Wingtech (a04)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
        
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip patch libelf-dev \
          wget xz-utils device-tree-compiler libfdt-dev build-essential

    - name: Direct Integration of KernelSU-Next (Legacy)
      run: |
        # إزالة أي مجلد قديم وضمان النظافة
        rm -rf drivers/kernelsu
        mkdir -p drivers/kernelsu
        
        # استنساخ فرع legacy مؤقتاً
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git --branch legacy temp_ksu
        
        # نقل محتويات مجلد kernel فقط إلى مسار drivers/kernelsu الصحيح
        cp -r temp_ksu/kernel/* drivers/kernelsu/
        
        # تنظيف المجلد المؤقت
        rm -rf temp_ksu
        
        # التأكد من إضافة مجلد kernelsu إلى ملف drivers/Makefile لكي تتم ترجمته
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        fi

        # حل نهائي لخطأ undefined reference لـ ksu_handle_devpts
        if ! grep -q "ksu_handle_devpts" drivers/kernelsu/*.c 2>/dev/null; then
          echo "" >> drivers/kernelsu/ksu.c
          echo "int ksu_handle_devpts(void *inode) { return 0; }" >> drivers/kernelsu/ksu.c
        fi

    - name: Prepare directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC toolchain
      run: |
        cd toolchain/gcc
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xf
        tar -xf gcc.tar.xf -C ./
        
    - name: Download Clang r383902
      run: |
        cd toolchain/clang
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902
        
    - name: Export environment variables
      run: |
        echo "CROSS_COMPILE=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CC=$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin/clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w" >> $GITHUB_ENV
        echo "LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV
        
    - name: Build kernel
      run: |
        # 0. Pre-build scripts explicitly to avoid host compilation race conditions
        make -C $(pwd) O=$(pwd)/out \
          KBUILD_CFLAGS="-std=gnu89 -fno-strict-prototypes -fcommon" \
          KCFLAGS="-w -fno-strict-aliasing -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types" \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          scripts

        # 1. Generate base configuration
        make -C $(pwd) O=$(pwd)/out \
          KBUILD_CFLAGS="-std=gnu89 -fno-strict-prototypes -fcommon" \
          KCFLAGS="-w -fno-strict-aliasing -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=misleading-indentation" \
          CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          rsuntk-a04_defconfig

        # 2. Append the custom config fragment using the correct filename (rsuntk-config)
        if [ -f "rsuntk-config" ]; then
          cat rsuntk-config >> $(pwd)/out/.config
        elif [ -f "arch/arm64/configs/rsuntk-config" ]; then
          cat arch/arm64/configs/rsuntk-config >> $(pwd)/out/.config
        fi

        # 3. Update configuration dependencies
        make -C $(pwd) O=$(pwd)/out \
          KBUILD_CFLAGS="-std=gnu89 -fno-strict-prototypes -fcommon" \
          KCFLAGS="-w -fno-strict-aliasing -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=misleading-indentation" \
          CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          olddefconfig

        # 4. Compile the kernel with full compatibility flags for drivers and KSU
        make -C $(pwd) O=$(pwd)/out \
          KBUILD_CFLAGS="-std=gnu89 -fno-strict-prototypes -fcommon" \
          KCFLAGS="-w -fno-strict-aliasing -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=misleading-indentation" \
          CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          -j$(nproc)
          
    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git anykernel

    - name: Pack Kernel with AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image anykernel/
        cp out/arch/arm64/boot/dtb* anykernel/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* anykernel/ 2>/dev/null || true
        cd anykernel
        zip -r9 ../A04-KernelSU-Next-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Flashable Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KernelSU-Next-AnyKernel3
        path: A04-KernelSU-Next-AnyKernel3.zip
