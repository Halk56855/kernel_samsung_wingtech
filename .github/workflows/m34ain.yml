name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - ReSukiSU - CPU & GPU 850MHz - SusFS Official)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc-11 g++-11 clang lld python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-11-aarch64-linux-gnu gcc-11-arm-linux-gnueabi cpio patch

    - name: Setup ReSukiSU, Official SusFS 4.19 & Apply Patches with Diagnostic
      run: |
        rm -rf drivers/kernelsu ReSukiSU susfs4ksu .git/modules/ReSukiSU .git/modules/susfs4ksu fs/ksu_compat.c
        
        # استنساخ المستودعات
        git clone -b main https://github.com/ReSukiSU/ReSukiSU.git ReSukiSU
        git clone -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
        
        python3 -c '
        import os, shutil

        # تنظيف فحص الـ manual hook في ReSukiSU
        for root, dirs, files in os.walk("ReSukiSU"):
            for f in files:
                if f.endswith(".mk") or f == "Makefile":
                    fp = os.path.join(root, f)
                    try:
                        with open(fp, "r", errors="ignore") as fh: content = fh.read()
                        if "manual_hook_check" in content:
                            content = content.replace("include", "# include")
                            content = content.replace("manual_hook_check", "# manual_hook_check")
                            with open(fp, "w") as fh: fh.write(content)
                    except:
                        pass

        ksu_src = None
        for root, dirs, files in os.walk("ReSukiSU"):
            if "Kconfig" in files:
                ksu_src = root
                break
        
        if not ksu_src:
            raise Exception("Error: Kconfig not found inside ReSukiSU repository!")

        if os.path.islink("drivers/kernelsu") or os.path.exists("drivers/kernelsu"):
            if os.path.islink("drivers/kernelsu"):
                os.unlink("drivers/kernelsu")
            else:
                shutil.rmtree("drivers/kernelsu")

        os.symlink(os.path.relpath(ksu_src, "drivers"), "drivers/kernelsu")

        # نسخ ملفات SusFS الرسمية
        susfs_patches = "susfs4ksu/kernel_patches"
        if os.path.exists(susfs_patches):
            src_fs = os.path.join(susfs_patches, "fs")
            if os.path.exists(src_fs):
                for item in os.listdir(src_fs):
                    s = os.path.join(src_fs, item)
                    d = os.path.join("fs", item)
                    if os.path.isdir(s):
                        if os.path.exists(d): shutil.rmtree(d)
                        shutil.copytree(s, d)
                    else:
                        shutil.copy2(s, d)

            src_inc = os.path.join(susfs_patches, "include/linux")
            if os.path.exists(src_inc):
                os.makedirs("include/linux", exist_ok=True)
                for item in os.listdir(src_inc):
                    s = os.path.join(src_inc, item)
                    d = os.path.join("include/linux", item)
                    shutil.copy2(s, d)

            # تطبيق باتش KernelSU مع فحص الأخطاء
            ksu_patch_src = os.path.join(susfs_patches, "KernelSU/10_enable_susfs_for_ksu.patch")
            if os.path.exists(ksu_patch_src):
                shutil.copy2(ksu_patch_src, "drivers/kernelsu/")
                res = os.system("cd drivers/kernelsu && patch -p1 --forward < 10_enable_susfs_for_ksu.patch")
                if res != 0:
                    print("WARNING: 10_enable_susfs_for_ksu.patch had rejections!")

            # تطبيق باتش النواة لنظام 4.19 مع فحص الأخطاء وملفات .rej
            for p_file in os.listdir(susfs_patches):
                if p_file.startswith("50_add_susfs_in_kernel") and "4.19" in p_file:
                    shutil.copy2(os.path.join(susfs_patches, p_file), ".")
                    res = os.system(f"patch -p1 --forward < {p_file}")
                    if res != 0:
                        print(f"ERROR: {p_file} failed to apply cleanly! Checking for .rej files...")
                        for r, ds, fs in os.walk("."):
                            for file in fs:
                                if file.endswith(".rej"):
                                    rej_path = os.path.join(r, file)
                                    print(f"=== REJ FILE: {rej_path} ===")
                                    with open(rej_path, "r", errors="ignore") as rf:
                                        print(rf.read())
                    break

        compat_code = """
        #include <linux/module.h>
        #include <linux/types.h>
        #include <linux/fs.h>
        #include <linux/sched.h>
        #include <linux/uaccess.h>

        bool ksu_vfs_read_hook(struct file *file, char __user *buf, size_t count, loff_t *pos) { return false; }
        int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos, ssize_t *ret) { return 0; }
        bool ksu_execveat_hook(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) { return false; }
        int ksu_handle_execveat_sucompat(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) { return 0; }
        """
        with open("fs/ksu_compat.c", "w") as f:
            f.write(compat_code)

        if os.path.exists("fs/Makefile"):
            with open("fs/Makefile", "r") as f: f_content = f.read()
            if "ksu_compat.o" not in f_content:
                with open("fs/Makefile", "a") as f: f.write("\nobj-y += ksu_compat.o\n")

        ksu_mk = "ccflags-y += -w -I$(src) -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux\n_ksu_c_files := $(shell cd $(src) && find . -name \\\"*.c\\\" -not -path \\\"./.*\\\" -not -path \\\"*/tools/*\\\")\nobj-y += $(_ksu_c_files:.c=.o)\n"
        with open("drivers/kernelsu/Makefile", "w") as f:
            f.write(ksu_mk)

        rules_path = "drivers/kernelsu/selinux/rules.c"
        if os.path.exists(rules_path):
            with open(rules_path, "r", errors="ignore") as fh: content = fh.read()
            content = content.replace("selinux_status_update_policyload(0)", "selinux_status_update_policyload(&selinux_state, 0)")
            if "db = &policydb;" in content:
                content = content.replace("db = &policydb;", "extern struct policydb policydb;\n\tdb = &policydb;")
            with open(rules_path, "w") as fh: fh.write(content)

        selinux_path = "drivers/kernelsu/selinux/selinux.c"
        if os.path.exists(selinux_path):
            with open(selinux_path, "r", errors="ignore") as fh: content = fh.read()
            if "#include \"selinux_defs.h\"" not in content:
                content = "#include \"selinux_defs.h\"\n" + content
            with open(selinux_path, "w") as fh: fh.write(content)

        if os.path.exists("drivers/Kconfig"):
            with open("drivers/Kconfig", "r") as f: k_content = f.read()
            if "kernelsu" not in k_content:
                with open("drivers/Kconfig", "a") as f: f.write("\nsource \"drivers/kernelsu/Kconfig\"\n")
        if os.path.exists("drivers/Makefile"):
            with open("drivers/Makefile", "r") as f: m_content = f.read()
            if "kernelsu" not in m_content:
                with open("drivers/Makefile", "a") as f: f.write("\nobj-y += kernelsu/\n")
        '

    - name: Apply CPU, GPU 850MHz Overclock & VDSO Fixes
      run: |
        python3 -c '
        import os

        for root, dirs, files in os.walk("."):
            for f in files:
                if f == "Makefile" or f.endswith(".mk"):
                    fp = os.path.join(root, f)
                    try:
                        with open(fp, "r", errors="ignore") as fh: content = fh.read()
                        if "-Os" in content:
                            content = content.replace("-Os", "-O2")
                            with open(fp, "w") as fh: fh.write(content)
                    except:
                        pass

        gpu_map = {
            "680000000": "850000000",
            "680000": "850000",
            "680MHz": "850MHz",
            "680mhz": "850mhz"
        }
        for root, dirs, files in os.walk("."):
            for f in files:
                if f.endswith((".c", ".h", ".dts", ".dtsi", ".txt", ".cpp")):
                    fp = os.path.join(root, f)
                    try:
                        with open(fp, "r", errors="ignore") as fh: content = fh.read()
                        modified = False
                        for old_k, new_v in gpu_map.items():
                            if old_k in content:
                                content = content.replace(old_k, new_v)
                                modified = True
                        if modified:
                            with open(fp, "w") as fh: fh.write(content)
                    except:
                        pass

        vget_path = "arch/arm64/kernel/vdso/vgettimeofday.c"
        if os.path.exists(vget_path):
            with open(vget_path, "r", errors="ignore") as fh: content = fh.read()
            if "memcpy(" not in content:
                content += "\n\nvoid *memcpy(void *dest, const void *src, __SIZE_TYPE__ n) { char *d = dest; const char *s = src; while (n--) *d++ = *s++; return dest; }\n"
                content += "void *memset(void *s, int c, __SIZE_TYPE__ n) { unsigned char *p = s; while (n--) *p++ = (unsigned char)c; return s; }\n"
            with open(vget_path, "w") as fh: content = fh.write(content)

        vdso_mk = "arch/arm64/kernel/vdso/Makefile"
        if os.path.exists(vdso_mk):
            with open(vdso_mk, "r", errors="ignore") as fh: content = fh.read()
            content = content.replace("-shared", "-shared -ffreestanding -fno-builtin -fno-builtin-memcpy -fno-builtin-memset")
            with open(vdso_mk, "w") as fh: content = fh.write(content)
        '

        if [ -f /usr/bin/ld.lld ] && [ ! -f /usr/bin/ld.lld.real ]; then
          sudo mv /usr/bin/ld.lld /usr/bin/ld.lld.real
        elif [ -f /usr/local/bin/ld.lld ] && [ ! -f /usr/local/bin/ld.lld.real ]; then
          sudo mv /usr/local/bin/ld.lld /usr/local/bin/ld.lld.real
        fi

        python3 -c '
        wrapper_content = """#!/bin/bash
        NEW_ARGS=()
        for arg in \"$@\"; do
            case \"$arg\" in
                -fno-builtin*|-ffreestanding|-fno-common|-fno-stack-protector)
                    ;;
                *)
                    NEW_ARGS+=(\"$arg\")
                    ;;
            esac
        done
        exec -a ld.lld /usr/bin/ld.lld.real \"${NEW_ARGS[@]}\"
        """
        with open("/usr/local/bin/ld.lld", "w") as f:
            f.write(wrapper_content)
        '
        sudo chmod +x /usr/local/bin/ld.lld

    - name: Set Environment Variables
      run: |
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=aarch64-linux-gnu-gcc-11" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true
        sed -i 's/CONFIG_CC_OPTIMIZE_FOR_SIZE=y/CONFIG_CC_OPTIMIZE_FOR_SIZE=n/g' $(pwd)/out/.config || true
        
        if grep -q "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE" $(pwd)/out/.config; then
          sed -i 's/# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/g' $(pwd)/out/.config || true
          sed -i 's/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=n/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/g' $(pwd)/out/.config || true
        else
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> $(pwd)/out/.config
        fi

        # إعدادات النواة والأداء و SusFS
        echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> $(pwd)/out/.config
        echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> $(pwd)/out/.config
        echo "CONFIG_SCHED_SMT=y" >> $(pwd)/out/.config
        echo "CONFIG_IKHEADERS=n" >> $(pwd)/out/.config
        echo "CONFIG_KSU=y" >> $(pwd)/out/.config
        echo "CONFIG_KPROBES=y" >> $(pwd)/out/.config
        echo "CONFIG_KPROBE_EVENTS=y" >> $(pwd)/out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $(pwd)/out/.config
        echo "CONFIG_KALLSYMS=y" >> $(pwd)/out/.config
        echo "CONFIG_KALLSYMS_ALL=y" >> $(pwd)/out/.config
        echo "CONFIG_SECURITY_SELINUX=y" >> $(pwd)/out/.config
        echo "CONFIG_SECURITY_SELINUX_DISABLE=y" >> $(pwd)/out/.config
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $(pwd)/out/.config
        
        # تعطيل LTO لمنع مشاكل التجميع
        echo "CONFIG_LTO=n" >> $(pwd)/out/.config
        echo "CONFIG_LTO_CLANG=n" >> $(pwd)/out/.config
        echo "CONFIG_THINLTO=n" >> $(pwd)/out/.config
        
        # خيارات SusFS
        echo "CONFIG_KPM=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_SUSFS=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> $(pwd)/out/.config

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        # تشغيل البناء مع التقاط الخطأ بدقة في حال الفشل
        make -C $(pwd) O=$(pwd)/out -j$(nproc) || {
          echo "=== BUILD FAILED. SHOWING LAST ERRORS ==="
          find $(pwd)/out -name "*.o.cmd" -o -name "*.err" | head -n 20
          exit 1
        }

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-ReSukiSU-SusFS-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-ReSukiSU-SusFS-Zip
        path: A04-ReSukiSU-SusFS-AnyKernel3.zip
