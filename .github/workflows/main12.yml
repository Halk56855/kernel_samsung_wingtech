name: Build Kernel Samsung Wingtech 3.3.0 (a04)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clean repository and patch pty.c for KernelSU-Next Legacy
      run: |
        git checkout drivers/tty/pty.c || true
        git reset --hard || true

        python3 -c '
        path = "drivers/tty/pty.c"
        try:
            with open(path, "r") as f:
                content = f.read()
            if "ksu_handle_devpts" in content:
                lines = content.splitlines()
                new_lines = []
                for line in lines:
                    if "ksu_handle_devpts" in line and not "int ksu_handle_devpts" in line:
                        new_lines.append("/* " + line + " -- Disabled for KSU-Next Legacy */")
                    else:
                        new_lines.append(line)
                with open(path, "w") as f:
                    f.write("\n".join(new_lines) + "\n")
                print("Successfully patched drivers/tty/pty.c")
        except Exception as e:
            print("Error patching pty.c:", e)
        '

    - name: Create compatibility header for Linux 4.19 (pgtable.h)
      run: |
        mkdir -p include/linux
        echo -e "#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif" > include/linux/pgtable.h

    - name: Integrate KernelSU-Next (Legacy) & Proper Wiring
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s 3.3.0

        if [ ! -d "drivers/kernelsu" ]; then
          if [ -d "KernelSU-Next/kernel" ]; then
            ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          elif [ -d "KernelSU/kernel" ]; then
            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi
        fi

        python3 -c '
        with open("drivers/Makefile", "r") as f:
            content = f.read()
        if "kernelsu" not in content:
            content += "\nobj-$(CONFIG_KSU) += kernelsu/\n"
            with open("drivers/Makefile", "w") as f:
                f.write(content)
        '

        python3 -c '
        with open("drivers/Kconfig", "r") as f:
            content = f.read()
        if "drivers/kernelsu/Kconfig" not in content:
            idx = content.rfind("endmenu")
            if idx != -1:
                content = content[:idx] + "source \"drivers/kernelsu/Kconfig\"\n\n" + content[idx:]
            else:
                content += "\nsource \"drivers/kernelsu/Kconfig\"\n"
            with open("drivers/Kconfig", "w") as f:
                f.write(content)
        '

    - name: Patch file_wrapper.c for Linux 4.19 compatibility
      run: |
        python3 -c '
        path = "drivers/kernelsu/infra/file_wrapper.c"
        try:
            with open(path, "r") as f:
                content = f.read()

            def comment_out_function(text, func_name):
                idx = text.find(func_name)
                while idx != -1:
                    line_start = text.rfind("\n", 0, idx) + 1
                    brace_count = 0
                    end_idx = idx
                    started = False
                    for i in range(idx, len(text)):
                        if text[i] == "{":
                            brace_count += 1
                            started = True
                        elif text[i] == "}":
                            brace_count -= 1
                            if started and brace_count == 0:
                                end_idx = i + 1
                                break
                    if started:
                        func_code = text[line_start:end_idx]
                        commented = "\n".join(["/* " + line + " */" for line in func_code.splitlines()])
                        text = text[:line_start] + commented + text[end_idx:]
                    else:
                        break
                    idx = text.find(func_name, line_start + len(commented))
                return text

            content = comment_out_function(content, "ksu_wrapper_iopoll")
            content = comment_out_function(content, "ksu_wrapper_remap_file_range")

            # Patch or stub modern anon_inode functions for Linux 4.19
            idx = content.find("anon_inode_mnt")
            if idx != -1:
                func_start = content.rfind("struct file *", 0, idx)
                if func_start == -1:
                    func_start = content.rfind("void *", 0, idx)
                if func_start == -1:
                    func_start = content.rfind("\n\n", 0, idx) + 2
                
                brace_count = 0
                func_end = idx
                started = False
                for i in range(idx, len(content)):
                    if content[i] == "{":
                        brace_count += 1
                        started = True
                    elif content[i] == "}":
                        brace_count -= 1
                        if started and brace_count == 0:
                            func_end = i + 1
                            break
                if started:
                    stub = "struct file *anon_inode_make_secure(const char *name, const struct file_operations *fops, void *priv, int flags)\n{\n\treturn ERR_PTR(-EOPNOTSUPP);\n}"
                    content = content[:func_start] + stub + content[func_end:]

            lines = content.splitlines()
            new_lines = []
            for line in lines:
                if ".iopoll" in line or ".remap_file_range" in line or "f_op->iopoll" in line or "f_op->remap_file_range" in line or "REMAP_FILE_DEDUP" in line:
                    new_lines.append("/* " + line + " -- Disabled for Linux 4.19 */")
                else:
                    new_lines.append(line)

            with open(path, "w") as f:
                f.write("\n".join(new_lines) + "\n")
            print("Successfully patched file_wrapper.c for Linux 4.19")
        except Exception as e:
            print("Error patching file_wrapper.c:", e)
        '

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip \
          wget xz-utils device-tree-compiler libfdt-dev \
          gcc-arm-linux-gnueabi

    - name: Prepare directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC toolchain
      run: |
        cd toolchain/gcc
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Clang r383902 (Compatible)
      run: |
        cd toolchain/clang
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Export environment variables
      run: |
        echo "CROSS_COMPILE=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin/clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w" >> $GITHUB_ENV
        echo "LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        BUILD_ARGS="O=$(pwd)/out CC=$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin/clang LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y"

        make -C $(pwd) $BUILD_ARGS rsuntk-a04_defconfig

        if [ -f "$(pwd)/arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config $(pwd)/arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true
        
        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        EOT

        make -C $(pwd) $BUILD_ARGS olddefconfig

        make -C $(pwd) $BUILD_ARGS -j$(nproc) || make -C $(pwd) $BUILD_ARGS -j1

    - name: Package with AnyKernel3-a04
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KernelSU-Next-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KernelSU-Next-Flashable-Zip
        path: A04-KernelSU-Next-AnyKernel3.zip
