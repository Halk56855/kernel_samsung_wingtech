name: Build rsuntk A04 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup KernelSU for Non-GKI (Manual Hook)
        run: |
          if [ ! -d "drivers/kernelsu" ]; then
            git clone https://github.com/rsuntk/KernelSU.git temp_ksu
            if [ -d "temp_ksu/kernel" ]; then
              cp -r temp_ksu/kernel drivers/kernelsu
            else
              cp -r temp_ksu drivers/kernelsu
            fi
            rm -rf temp_ksu
          fi
          
          if ! grep -q "kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            xz-utils \
            zip

      - name: Download Google Clang r574158
        run: |
          mkdir clang
          cd clang
          curl -L \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/508ea7dd0d8f681904d0422e98af9613aaabf180/clang-r574158.tar.gz \
          | tar -xz

      - name: Set environment
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Merge custom configs
        run: |
          cat arch/arm64/configs/rsuntk-config >> arch/arm64/configs/rsuntk-a04_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/rsuntk-a04_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/rsuntk-a04_defconfig

      - name: Fix Source and Kconfig Issues Automatically
        run: |
          python3 - << 'EOF'
          import os
          import re
          import textwrap

          # Fix scripts/kconfig/conf.c compilation errors robustly
          conf_c = "scripts/kconfig/conf.c"
          if os.path.exists(conf_c):
              with open(conf_c, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
              
              new_lines = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if "Configuration file" in line or "Can't find default configuration" in line or "Can't read seed configuration" in line or "KCONFIG_ALLCONFIG set" in line:
                      new_lines.append('fprintf(stderr, "*** Configuration error: file not found or invalid!\\n");\n')
                      while i < len(lines) and ");" not in lines[i]:
                          i += 1
                      i += 1
                      continue
                  new_lines.append(line)
                  i += 1
                  
              with open(conf_c, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # General cleanup for other files
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".c", ".h", "Kconfig", "Makefile")) or file == "Kconfig" or file.endswith(".Kconfig"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "rb") as f:
                              content = f.read()
                          content = content.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
                          with open(path, "wb") as f:
                              f.write(content)
                      except Exception:
                          pass
          EOF

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            rsuntk-a04_defconfig
          
          grep KSU .config
          
          make -j$(nproc) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-implicit-function-declaration" \
            || make -j1 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=gcc HOSTCXX=g++ KCFLAGS="-Wno-error=implicit-function-declaration -Wno-implicit-function-declaration"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kernel
          path: |
            .config
            arch/arm64/boot/Image*
            arch/arm64/boot/dts/**/*.dtb
            arch/arm64/boot/dts/**/*.dtbo
