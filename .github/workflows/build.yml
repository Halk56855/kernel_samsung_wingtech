name: Build rsuntk A04 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup KernelSU for Non-GKI (Manual Hook)
        run: |
          if [ ! -d "drivers/kernelsu" ]; then
            git clone https://github.com/rsuntk/KernelSU.git temp_ksu
            if [ -d "temp_ksu/kernel" ]; then
              cp -r temp_ksu/kernel drivers/kernelsu
            else
              cp -r temp_ksu drivers/kernelsu
            fi
            rm -rf temp_ksu
          fi
          
          # تأكد من ربط KernelSU بملفات drivers الرئيسية
          if ! grep -q "kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            xz-utils \
            zip

      - name: Download Google Clang r574158
        run: |
          mkdir clang
          cd clang
          curl -L \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/508ea7dd0d8f681904d0422e98af9613aaabf180/clang-r574158.tar.gz \
          | tar -xz

      - name: Set environment
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Merge custom configs
        run: |
          cat arch/arm64/configs/rsuntk-config >> arch/arm64/configs/rsuntk-a04_defconfig
          # تفعيل خيار Manual Hook الخاص بنواتك Non-GKI
          echo "CONFIG_KSU=y" >> arch/arm64/configs/rsuntk-a04_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/rsuntk-a04_defconfig

      - name: Fix Source and Kconfig Issues Automatically
        run: |
          python3 -c '
          import os
          import textwrap

          # 0. Clean carriage returns across all source, header, Kconfig, and Makefile files
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".c", ".h", "Kconfig", "Makefile")) or file == "Kconfig" or file.endswith(".Kconfig"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "rb") as f:
                              content = f.read()
                          cleaned = content.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
                          with open(path, "wb") as f:
                              f.write(cleaned)
                      except Exception:
                          pass

          hx_kconfig = "drivers/input/touchscreen/mediatek/hxchipset_hx83108x/Kconfig"
          if os.path.exists(hx_kconfig):
              with open(hx_kconfig, "r") as f:
                  lines = f.readlines()
              new_lines = [line[1:] if line.startswith("+") else line for line in lines]
              with open(hx_kconfig, "w") as f:
                  f.writelines(new_lines)

          qos_mk = "drivers/misc/mediatek/base/power/qos/Makefile"
          if os.path.exists(qos_mk):
              with open(qos_mk, "r") as f:
                  lines = f.readlines()
              new_lines = []
              else_count = 0
              in_conditional = False
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith("ifeq") or stripped.startswith("ifneq") or stripped.startswith("ifdef") or stripped.startswith("ifndef"):
                      in_conditional = True
                      else_count = 0
                      new_lines.append(line)
                  elif stripped.startswith("endif"):
                      in_conditional = False
                      else_count = 0
                      new_lines.append(line)
                  elif stripped.startswith("else"):
                      if in_conditional:
                          if else_count == 0:
                              new_lines.append("else\n")
                              else_count += 1
                          else:
                              pass
                      else:
                          new_lines.append(line)
                  else:
                      new_lines.append(line)
              with open(qos_mk, "w") as f:
                  f.writelines(new_lines)

          mtk_spm_c = "drivers/misc/mediatek/base/power/spm/mt6765/mtk_spm.c"
          if os.path.exists(mtk_spm_c):
              with open(mtk_spm_c, "r") as f:
                  content = f.read()
              header_fix = textwrap.dedent("""
              #ifndef PWR_STATUS
              #define PWR_STATUS 0x000
              #endif
              #ifndef MD1_PWR_CON
              #define MD1_PWR_CON 0x004
              #endif
              #ifndef PCM_REG13_DATA
              #define PCM_REG13_DATA 0x008
              #endif
              #ifndef SPARE_ACK_MASK
              #define SPARE_ACK_MASK 0x00C
              #endif
              extern unsigned int spm_read(unsigned int offset);
              """)
              if "PWR_STATUS" not in content[:1000]:
                  content = header_fix + content
              with open(mtk_spm_c, "w") as f:
                  f.write(content)

          mtk_twam_c = "drivers/misc/mediatek/base/power/spm/mt6765/mtk_spm_twam.c"
          if os.path.exists(mtk_twam_c):
              with open(mtk_twam_c, "r") as f:
                  twam_content = f.read()
              twam_content = twam_content.replace("#include <mtk_spm_internal.h>", "#include \"mtk_spm_internal.h\"")
              twam_fixes = textwrap.dedent("""
              #ifndef SPM_TWAM_CON
              #define SPM_TWAM_CON 0x0A0
              #endif
              #ifndef TWAM_ENABLE_LSB
              #define TWAM_ENABLE_LSB (1U << 0)
              #endif
              #ifndef TWAM_SPEED_MODE_ENABLE_LSB
              #define TWAM_SPEED_MODE_ENABLE_LSB (1U << 1)
              #endif
              #ifndef SPM_IRQ_MASK
              #define SPM_IRQ_MASK 0x0B4
              #endif
              #ifndef SPM_IRQ_STA
              #define SPM_IRQ_STA 0x0B8
              #endif
              """)
              twam_content = twam_content.replace("#define ISRM_TWAM (1U << 10)", "")
              twam_content = twam_content.replace("#define ISRC_TWAM (1U << 10)", "")
              if "SPM_TWAM_CON" not in twam_content[:1500]:
                  twam_content = twam_fixes + twam_content
              with open(mtk_twam_c, "w") as f:
                  f.write(twam_content)

          mtk_irq_c = "drivers/misc/mediatek/base/power/spm/mt6765/mtk_spm_irq.c"
          if os.path.exists(mtk_irq_c):
              with open(mtk_irq_c, "r") as f:
                  irq_content = f.read()
              irq_content = irq_content.replace("#include <mtk_spm.h>", "#include \"mtk_spm.h\"")
              irq_content = irq_content.replace("#include <mtk_spm_irq.h>", "#include \"mtk_spm_irq.h\"")
              irq_content = irq_content.replace("#include <mtk_spm_internal.h>", "#include \"mtk_spm_internal.h\"")
              irq_content = irq_content.replace("#include <mtk_spm_irq_edge.h>", "#include \"mtk_spm_irq_edge.h\"")

              irq_fixes = textwrap.dedent("""
              #ifndef WAKE_SRC_R12_KP_IRQ_B
              #define WAKE_SRC_R12_KP_IRQ_B (1U << 0)
              #endif
              #ifndef WAKE_SRC_R12_MD1_WDT_B
              #define WAKE_SRC_R12_MD1_WDT_B (1U << 1)
              #endif
              #ifndef WAKE_SRC_R12_SYS_CIRQ_IRQ_B
              #define WAKE_SRC_R12_SYS_CIRQ_IRQ_B (1U << 2)
              #endif
              #ifndef SPM_SW_RSV_0
              #define SPM_SW_RSV_0 0x010
              #endif
              #ifndef SPM_IRQ_STA
              #define SPM_IRQ_STA 0x0B8
              #endif
              #ifndef SPM_TWAM_LAST_STA0
              #define SPM_TWAM_LAST_STA0 0x0A4
              #endif
              #ifndef SPM_TWAM_LAST_STA1
              #define SPM_TWAM_LAST_STA1 0x0A8
              #endif
              #ifndef SPM_TWAM_LAST_STA2
              #define SPM_TWAM_LAST_STA2 0x0AC
              #endif
              #ifndef SPM_TWAM_LAST_STA3
              #define SPM_TWAM_LAST_STA3 0x0B0
              #endif
              #ifndef SPM_TWAM_CON
              #define SPM_TWAM_CON 0x0A0
              #endif
              #ifndef SPM_TWAM_IDLE_SEL
              #define SPM_TWAM_IDLE_SEL 0x0C0
              #endif
              """)
              if "WAKE_SRC_R12_KP_IRQ_B" not in irq_content[:1500]:
                  irq_content = irq_fixes + irq_content
              with open(mtk_irq_c, "w") as f:
                  f.write(irq_content)

          mtk_dram_c = "drivers/misc/mediatek/base/power/spm/mt6765/mtk_spm_dram.c"
          if os.path.exists(mtk_dram_c):
              with open(mtk_dram_c, "r") as f:
                  dram_content = f.read()
              dram_content = dram_content.replace("#include <mtk_spm_internal.h>", "#include \"mtk_spm_internal.h\"")
              dram_fixes = textwrap.dedent("""
              #ifndef SPM_POWER_ON_VAL0
              #define SPM_POWER_ON_VAL0 0x100
              #endif
              #ifndef R0_SC_PHYPLL_MODE_SW_PCM
              #define R0_SC_PHYPLL_MODE_SW_PCM (1U << 14)
              #endif
              #ifndef R0_SC_PHYPLL2_MODE_SW_PCM
              #define R0_SC_PHYPLL2_MODE_SW_PCM (1U << 15)
              #endif
              """)
              if "SPM_POWER_ON_VAL0" not in dram_content[:1500]:
                  dram_content = dram_fixes + dram_content
              with open(mtk_dram_c, "w") as f:
                  f.write(dram_content)
          '

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            rsuntk-a04_defconfig
          
          grep KSU .config
          
          make -j$(nproc) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-implicit-function-declaration" \
            || make -j1 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang KCFLAGS="-Wno-error=implicit-function-declaration -Wno-implicit-function-declaration"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kernel
          path: |
            .config
            arch/arm64/boot/Image*
            arch/arm64/boot/dts/**/*.dtb
            arch/arm64/boot/dts/**/*.dtbo
