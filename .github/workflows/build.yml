name: Build rsuntk A04 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup KernelSU for Non-GKI (Manual Hook)
        run: |
          if [ ! -d "drivers/kernelsu" ]; then
            git clone https://github.com/rsuntk/KernelSU.git temp_ksu
            if [ -d "temp_ksu/kernel" ]; then
              cp -r temp_ksu/kernel drivers/kernelsu
            else
              cp -r temp_ksu drivers/kernelsu
            fi
            rm -rf temp_ksu
          fi
          
          if ! grep -q "kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            xz-utils \
            zip

      - name: Download Google Clang r574158
        run: |
          mkdir clang
          cd clang
          curl -L \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/508ea7dd0d8f681904d0422e98af9613aaabf180/clang-r574158.tar.gz \
          | tar -xz

      - name: Set environment
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Merge custom configs
        run: |
          cat arch/arm64/configs/rsuntk-config >> arch/arm64/configs/rsuntk-a04_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/rsuntk-a04_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/rsuntk-a04_defconfig

      - name: Fix Host Tools and MTK SPM Definitions for Kernel 4.19
        run: |
          python3 - << 'EOF'
          import os

          # 1. Fix Host tools conf.c string issues
          conf_c = "scripts/kconfig/conf.c"
          if os.path.exists(conf_c):
              with open(conf_c, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              content = content.replace('"%s"', '"config"')
              content = content.replace('"%s" or "all.config"', '"config"')
              with open(conf_c, "w", encoding="utf-8") as f:
                  f.write(content)

          # 2. Fix MTK SPM missing definitions for mt6765 without touching core driver logic
          mtk_spm_c = "drivers/misc/mediatek/base/power/spm/mt6765/mtk_spm.c"
          if os.path.exists(mtk_spm_c):
              with open(mtk_spm_c, "r", encoding="utf-8", errors="ignore") as f:
                  spm_code = f.read()
              
              macro_fixes = """
              #ifndef PWR_STATUS
              #define PWR_STATUS 0x0
              #endif
              #ifndef MD1_PWR_CON
              #define MD1_PWR_CON 0x0
              #endif
              #ifndef PCM_REG13_DATA
              #define PCM_REG13_DATA 0x0
              #endif
              #ifndef SPARE_ACK_MASK
              #define SPARE_ACK_MASK SPM_SPARE_ACK_MASK
              #endif
              """
              if "PWR_STATUS" in spm_code and "PWR_STATUS" not in spm_code[:500]:
                  spm_code = macro_fixes + spm_code
                  with open(mtk_spm_c, "w", encoding="utf-8") as f:
                      f.write(spm_code)
          EOF

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            rsuntk-a04_defconfig
          
          grep KSU .config
          
          make -j$(nproc) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=macro-redefined" \
            || make -j1 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=gcc HOSTCXX=g++ KCFLAGS="-Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=macro-redefined"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kernel
          path: |
            .config
            arch/arm64/boot/Image*
            arch/arm64/boot/dts/**/*.dtb
            arch/arm64/boot/dts/**/*.dtbo
