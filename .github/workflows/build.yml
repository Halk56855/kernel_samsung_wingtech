name: Build rsuntk A04 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            xz-utils \
            zip

      - name: Download Google Clang r574158
        run: |
          mkdir clang
          cd clang
          curl -L \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/508ea7dd0d8f681904d0422e98af9613aaabf180/clang-r574158.tar.gz \
          | tar -xz

      - name: Set environment
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Merge custom configs
        run: |
          cat arch/arm64/configs/rsuntk-config >> arch/arm64/configs/rsuntk-a04_defconfig

      - name: Fix Source and Kconfig Issues Automatically
        run: |
          python3 -c '
          import os

          # 1. Remove leading "+" from Himax Kconfig
          hx_kconfig = "drivers/input/touchscreen/mediatek/hxchipset_hx83108x/Kconfig"
          if os.path.exists(hx_kconfig):
              with open(hx_kconfig, "r") as f:
                  lines = f.readlines()
              new_lines = [line[1:] if line.startswith("+") else line for line in lines]
              with open(hx_kconfig, "w") as f:
                  f.writelines(new_lines)

          # 2. Fix QOS Makefile extraneous text after else
          qos_mk = "drivers/misc/mediatek/base/power/qos/Makefile"
          if os.path.exists(qos_mk):
              with open(qos_mk, "r") as f:
                  lines = f.readlines()
              new_lines = []
              for line in lines:
                  if line.strip().startswith("else") and line.strip() != "else":
                      new_lines.append("else\n")
                  else:
                      new_lines.append(line)
              with open(qos_mk, "w") as f:
                  f.writelines(new_lines)

          # 3. Fix mtk_spm.c missing declarations and prototypes
          mtk_spm_c = "drivers/misc/mediatek/base/power/spm/mt6765/mtk_spm.c"
          if os.path.exists(mtk_spm_c):
              with open(mtk_spm_c, "r") as f:
                  content = f.read()
              
              header_fix = """
              #ifndef PWR_STATUS
              #define PWR_STATUS 0x000
              #endif
              #ifndef MD1_PWR_CON
              #define MD1_PWR_CON 0x004
              #endif
              #ifndef PCM_REG13_DATA
              #define PCM_REG13_DATA 0x008
              #endif
              #ifndef SPARE_ACK_MASK
              #define SPARE_ACK_MASK 0x00C
              #endif
              extern unsigned int spm_read(unsigned int offset);
              """
              if "PWR_STATUS" not in content[:1000]:
                  content = header_fix + content
              
              with open(mtk_spm_c, "w") as f:
                  f.write(content)
          '

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            rsuntk-a04_defconfig
          
          grep KSU .config
          
          make -j$(nproc) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=undeclared-identifier -Wno-implicit-function-declaration" \
            || make -j1 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=undeclared-identifier -Wno-implicit-function-declaration"

      - name: Upload build outputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: atlas-kernel
          path: |
            .config
            arch/arm64/boot/Image*
            arch/arm64/boot/dts/**/*.dtb
            arch/arm64/boot/dts/**/*.dtbo
