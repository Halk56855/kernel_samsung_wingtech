name: Build Kernel Samsung Wingtech A04 (Advanced Performance -O2, GPU 850MHz OC, vDSO & LLD Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        repository: Halk56855/kernel_samsung_wingtech
        ref: android-4.19-stable
        submodules: recursive

    - name: Clean Integration of KittiSU & Disabling KPM/SuSFS
      run: |
        echo "[-] Cleaning up old remnants..."
        rm -rf drivers/kernelsu KittiSU .git/modules/KittiSU fs/ksu_compat.c

        echo "[-] Cloning KittiSU repository (dev branch)..."
        git clone -b dev https://github.com/terebiko/KittiSU.git KittiSU

        echo "[-] Purging KPM/SuSFS completely..."
        python3 -c '
        import os, re
        for root, dirs, files in os.walk("KittiSU"):
            for f in files:
                fp = os.path.join(root, f)
                if "susfs" in f.lower() or "kpm" in f.lower():
                    try:
                        os.remove(fp)
                    except: pass
                    continue
                try:
                    with open(fp, "r", errors="ignore") as fh: content = fh.read()
                    if "manual_hook" in content or "You should integrate KittiSU" in content:
                        content = re.sub(r".*error.*", "# Bypassed", content)
                    with open(fp, "w") as fh: fh.write(content)
                except: pass
        '

        echo "[-] Linking KittiSU safely..."
        python3 -c '
        import os, shutil
        ksu_src = next((root for root, dirs, files in os.walk("KittiSU") if "Kconfig" in files), None)
        if os.path.lexists("drivers/kernelsu"):
            os.unlink("drivers/kernelsu")
        os.symlink(os.path.abspath(ksu_src), "drivers/kernelsu")
        '

        echo "[-] Injecting Compatibility Layer..."
        cat << 'EOF' > fs/ksu_compat.c
        #include <linux/module.h>
        #include <linux/types.h>
        #include <linux/fs.h>
        bool ksu_vfs_read_hook(struct file *f, char __user *b, size_t c, loff_t *p) { return false; }
        int ksu_handle_vfs_read(struct file *f, char __user *b, size_t c, loff_t *p, ssize_t *r) { return 0; }
        bool ksu_execveat_hook(int *d, struct filename **fn, struct user_arg_ptr *a, struct user_arg_ptr *e, int *f) { return false; }
        int ksu_handle_execveat_sucompat(int *d, struct filename **fn, struct user_arg_ptr *a, struct user_arg_ptr *e, int *f) { return 0; }
        EOF
        if ! grep -q "ksu_compat.o" fs/Makefile; then
            echo 'obj-y += ksu_compat.o' >> fs/Makefile
        fi

        echo "[-] Wiring Kconfig and Makefile..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

    - name: Apply Advanced Performance (-O2) & GPU OC (850MHz) & ld.lld Fix & vDSO memcpy Fix
      run: |
        echo "[-] Forcing -O2 performance optimization globally across Makefiles..."
        python3 -c '
        import os
        for root, dirs, files in os.walk("."):
            for f in files:
                if f == "Makefile" or f.endswith(".mk"):
                    fp = os.path.join(root, f)
                    try:
                        with open(fp, "r", errors="ignore") as fh:
                            content = fh.read()
                        if "-Os" in content:
                            content = content.replace("-Os", "-O2")
                            with open(fp, "w") as fh:
                                fh.write(content)
                    except:
                        pass
        '

        echo "[-] Applying exhaustive GPU Overclock (850MHz) across source tree..."
        python3 -c '
        import os
        freq_map = {
            "680000000": "850000000",
            "680000": "850000",
            "680MHz": "850MHz",
            "680mhz": "850mhz"
        }
        for root, dirs, files in os.walk("."):
            for f in files:
                if f.endswith((".c", ".h", ".dts", ".dtsi", ".txt", ".cpp")):
                    fp = os.path.join(root, f)
                    try:
                        with open(fp, "r", errors="ignore") as fh:
                            content = fh.read()
                        modified = False
                        for old_k, new_v in freq_map.items():
                            if old_k in content:
                                content = content.replace(old_k, new_v)
                                modified = True
                        if modified:
                            with open(fp, "w") as fh:
                                fh.write(content)
                    except:
                        pass
        '

        echo "[-] Injecting local memcpy/memset fallbacks for vDSO to prevent dynamic relocations..."
        python3 -c '
        import os
        vget_path = "arch/arm64/kernel/vdso/vgettimeofday.c"
        if os.path.exists(vget_path):
            with open(vget_path, "r") as fh: content = fh.read()
            if "memcpy(" not in content:
                content += "\n\nvoid *memcpy(void *dest, const void *src, __SIZE_TYPE__ n) {\n    char *d = dest;\n    const char *s = src;\n    while (n--)\n        *d++ = *s++;\n    return dest;\n}\n"
                content += "void *memset(void *s, int c, __SIZE_TYPE__ n) {\n    unsigned char *p = s;\n    while (n--)\n        *p++ = (unsigned char)c;\n    return s;\n}\n"
            with open(vget_path, "w") as fh: fh.write(content)

        vdso_mk = "arch/arm64/kernel/vdso/Makefile"
        if os.path.exists(vdso_mk):
            with open(vdso_mk, "r") as fh: content = fh.read()
            content = content.replace("-shared", "-shared -ffreestanding -fno-builtin -fno-builtin-memcpy -fno-builtin-memset")
            with open(vdso_mk, "w") as fh: fh.write(content)
        '

        echo "[-] Creating robust ld.lld wrapper filtering out compiler-specific flags..."
        if [ -f /usr/bin/ld.lld ] && [ ! -f /usr/bin/ld.lld.real ]; then
          sudo mv /usr/bin/ld.lld /usr/bin/ld.lld.real
        elif [ -f /usr/local/bin/ld.lld ] && [ ! -f /usr/local/bin/ld.lld.real ]; then
          sudo mv /usr/local/bin/ld.lld /usr/local/bin/ld.lld.real
        fi
        
        sudo tee /usr/local/bin/ld.lld << 'EOF'
        #!/bin/bash
        NEW_ARGS=()
        for arg in "$@"; do
            case "$arg" in
                -fno-builtin*|-ffreestanding|-fno-common|-fno-stack-protector)
                    ;;
                *)
                    NEW_ARGS+=("$arg")
                    ;;
            esac
        done
        exec -a ld.lld /usr/bin/ld.lld.real "${NEW_ARGS[@]}"
        EOF
        sudo chmod +x /usr/local/bin/ld.lld

    - name: Install build dependencies (GCC 11 & lld) First
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc-11 g++-11 clang lld python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-11-aarch64-linux-gnu gcc-11-arm-linux-gnueabi cpio

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export CLANG_TRIPLE=aarch64-linux-gnu-

        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig
        
        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_KSU=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_SIZE=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig
        make -C $(pwd) O=$(pwd)/out -j$(nproc)

    - name: Package & Upload
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-Kernel-GPU850-O2-Advanced.zip * -x .git README.md LICENSE
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-Kernel-GPU850-O2-Advanced-Zip
        path: A04-Kernel-GPU850-O2-Advanced.zip
