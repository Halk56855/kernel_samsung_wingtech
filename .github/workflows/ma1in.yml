name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Kernel Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git zip wget xz-utils device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio lld llvm android-sdk-libsparse-utils

      - name: Clean Clang Flags
        run: |
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) ! -path "*/out/*" ! -path "*/.git/*" | while read -r file; do
              if grep -q "default-const-init" "$file"; then
                  sed -i 's/-Wno-default-const-init-var-unsafe//g' "$file"
                  sed -i 's/-Wno-default-const-init-field-unsafe//g' "$file"
              fi
          done

      - name: Clone and Setup SukiSU-Ultra
        run: |
          rm -rf drivers/kernelsu SukiSU-Ultra
          git clone -b dev https://github.com/SukiSU-Ultra/SukiSU-Ultra.git SukiSU-Ultra
          
          if [ -d "SukiSU-Ultra/kernel" ]; then
              cp -r SukiSU-Ultra/kernel drivers/kernelsu
          elif [ -d "SukiSU-Ultra/drivers/kernelsu" ]; then
              cp -r SukiSU-Ultra/drivers/kernelsu drivers/kernelsu
          else
              cp -r SukiSU-Ultra drivers/kernelsu
          fi
          
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i '/MODULE_IMPORT_NS/d' {} +

      - name: Create Compatibility Layers and Headers
        run: |
          mkdir -p drivers/kernelsu/linux drivers/kernelsu/infra drivers/kernelsu/uapi drivers/kernelsu/sys
          
          cat << 'EOF' > drivers/kernelsu/cstdint
          #ifndef __KSU_CSTDINT_H
          #define __KSU_CSTDINT_H
          #include <linux/types.h>
          #include <linux/stddef.h>
          #ifndef _STDINT_H
          #define _STDINT_H
          #endif
          #endif
          EOF

          cat << 'EOF' > drivers/kernelsu/sys/ioctl.h
          #ifndef __KSU_SYS_IOCTL_H
          #define __KSU_SYS_IOCTL_H
          #include <linux/ioctl.h>
          #endif
          EOF

          cat << 'EOF' > drivers/kernelsu/ksu_compat.h
          #ifndef KSU_COMPAT_H
          #define KSU_COMPAT_H
          #ifndef TWA_RESUME
          #define TWA_RESUME 1
          #endif
          #ifndef fallthrough
          #define fallthrough do {} while (0)
          #endif
          #endif
          EOF

          cat << 'EOF' > drivers/kernelsu/linux/pgtable.h
          #ifndef __KSU_COMPAT_PGTABLE_H
          #define __KSU_COMPAT_PGTABLE_H
          #include <asm/pgtable.h>
          #endif
          EOF

          find SukiSU-Ultra -name "*.h" -exec cp -u {} drivers/kernelsu/uapi/ \; 2>/dev/null || true

          cat << 'EOF' > drivers/kernelsu/Makefile
          ccflags-y += -w -include $(src)/ksu_compat.h -I$(src) -I$(src)/include -I$(src)/uapi -I$(src)/sys
          _ksu_c_files := $(shell cd $(src) && find . -name "*.c" -not -path "./.*" -not -path "*/tools/*")
          obj-y += $(_ksu_c_files:.c=.o)
          EOF

      - name: Wire Kconfig and Makefile
        run: |
          if ! grep -q "kernelsu" drivers/Kconfig; then
              echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
              echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Build Kernel
        run: |
          mkdir -p toolchain/gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchain/gcc
          
          GCC_PATH=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin
          export CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-
          export ARCH=arm64
          export KCFLAGS="-w -Wno-error -I$(pwd)/drivers/kernelsu -I$(pwd)/drivers/kernelsu/include -I$(pwd)/drivers/kernelsu/uapi -I$(pwd)/drivers/kernelsu/sys"

          make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig
          
          cat << 'EOT' >> $(pwd)/out/.config
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KSU_SUSFS=n
          CONFIG_LTO=n
          CONFIG_LTO_CLANG=n
          CONFIG_THINLTO=n
          CONFIG_KPROBES=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_IKHEADERS=n
          EOT
          
          make -C $(pwd) O=$(pwd)/out olddefconfig
          make -C $(pwd) O=$(pwd)/out -j$(nproc)

      - name: Package Output
        run: |
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../A04-AnyKernel3-Final.zip *
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A04-Final-Kernel-Packages
          path: A04-AnyKernel3-Final.zip
