name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Kernel Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git zip wget xz-utils device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio lld llvm android-sdk-libsparse-utils

    - name: Patch, Clean Clang Flags & Build Kernel
      run: |
        echo "[-] Cleaning unknown/incompatible Clang warning flags across Makefiles..."
        python3 -c '
        import os
        for root, dirs, files in os.walk("."):
            if "out" in root or ".git" in root:
                continue
            for file in files:
                if file.endswith(("Makefile", "Kbuild")) or file == "Makefile":
                    fp = os.path.join(root, file)
                    try:
                        with open(fp, "r", errors="ignore") as f:
                            content = f.read()
                        if "-Wno-default-const-init" in content or "default-const-init" in content:
                            content = content.replace("-Wno-default-const-init-var-unsafe", "")
                            content = content.replace("-Wno-default-const-init-field-unsafe", "")
                            with open(fp, "w") as f:
                                f.write(content)
                    except Exception as e:
                        pass
        '

        echo "[-] Cloning SukiSU-Ultra..."
        rm -rf drivers/kernelsu SukiSU-Ultra
        git clone -b dev https://github.com/SukiSU-Ultra/SukiSU-Ultra.git SukiSU-Ultra

        echo "[-] Setting up SukiSU-Ultra and Compatibility Layer for Kernel 4.19..."
        python3 -c '
        import os, shutil

        ksu_src = None
        for root, dirs, files in os.walk("SukiSU-Ultra"):
            if "Kconfig" in files:
                ksu_src = root
                break

        if not ksu_src:
            raise Exception("Kconfig not found in SukiSU-Ultra clone!")

        if os.path.exists("drivers/kernelsu"):
            shutil.rmtree("drivers/kernelsu")
        shutil.copytree(ksu_src, "drivers/kernelsu")

        for root, dirs, files in os.walk("drivers/kernelsu"):
            for file in files:
                if file.endswith((".c", ".h")):
                    fp = os.path.join(root, file)
                    try:
                        with open(fp, "r", errors="ignore") as f:
                            lines = f.readlines()
                        modified = False
                        new_lines = []
                        for line in lines:
                            if "MODULE_IMPORT_NS" in line:
                                modified = True
                                continue
                            new_lines.append(line)
                        if modified:
                            with open(fp, "w") as f:
                                f.writelines(new_lines)
                    except Exception as e:
                        pass
        '

        echo "[-] Writing 4.19 compatible file_wrapper.c stub..."
        mkdir -p drivers/kernelsu/infra
        cat << 'EOF' > drivers/kernelsu/infra/file_wrapper.c
        #include <linux/fs.h>
        #include <linux/file.h>
        #include <linux/slab.h>

        struct ksu_file_wrapper {
            struct file *orig_file;
        };

        void *ksu_alloc_file_wrapper(struct file *filp) {
            struct ksu_file_wrapper *wrap = kzalloc(sizeof(struct ksu_file_wrapper), GFP_KERNEL);
            if (!wrap) return NULL;
            wrap->orig_file = filp;
            return wrap;
        }

        void ksu_release_file_wrapper(void *data) {
            if (data) {
                kfree(data);
            }
        }
        EOF

        cat << 'EOF' > drivers/kernelsu/ksu_compat.h
        #ifndef KSU_COMPAT_H
        #define KSU_COMPAT_H
        #ifndef TWA_RESUME
        #define TWA_RESUME 1
        #endif
        #ifndef fallthrough
        #define fallthrough do {} while (0)
        #endif
        #endif
        EOF

        mkdir -p drivers/kernelsu/linux
        cat << 'EOF' > drivers/kernelsu/linux/pgtable.h
        #ifndef __KSU_COMPAT_PGTABLE_H
        #define __KSU_COMPAT_PGTABLE_H
        #include <asm/pgtable.h>
        #endif
        EOF

        if [ -f drivers/kernelsu/Makefile ]; then
            if ! grep -q "ksu_compat.h" drivers/kernelsu/Makefile; then
                sed -i '1i ccflags-y += -w -include $(src)/ksu_compat.h -I$(src)' drivers/kernelsu/Makefile
            fi
        else
            cat << 'EOF' > drivers/kernelsu/Makefile
        ccflags-y += -w -include $(src)/ksu_compat.h -I$(src)
        _ksu_c_files := $(shell cd $(src) && find . -name "*.c" -not -path "./.*" -not -path "*/tools/*")
        obj-y += $(_ksu_c_files:.c=.o)
        EOF
        fi

        echo "[-] Wiring Kconfig..."
        if ! grep -q "kernelsu" drivers/Kconfig; then echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig; fi
        if ! grep -q "kernelsu" drivers/Makefile; then echo 'obj-y += kernelsu/' >> drivers/Makefile; fi

        echo "[-] Setting up Toolchains..."
        mkdir -p toolchain/gcc toolchain/clang
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C toolchain/gcc
        
        GCC_PATH=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin
        export CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-
        export ARCH=arm64
        export HOSTCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=strict-prototypes -Wno-error=format-security"
        export KCFLAGS="-w -Wno-error -I$(pwd)/drivers/kernelsu"

        echo "[-] Configuring Kernel..."
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig
        
        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_KSU=y
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        CONFIG_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_IKHEADERS=n
        EOT
        
        make -C $(pwd) O=$(pwd)/out olddefconfig

        echo "[-] Building Kernel..."
        make -C $(pwd) O=$(pwd)/out HOSTCFLAGS="$HOSTCFLAGS" KCFLAGS="$KCFLAGS" -j$(nproc) || make -C $(pwd) O=$(pwd)/out HOSTCFLAGS="$HOSTCFLAGS" KCFLAGS="$KCFLAGS" V=1 -j1

    - name: Package Output (AnyKernel3 & boot.img)
      run: |
        echo "[-] Packaging AnyKernel3..."
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../A04-AnyKernel3-Final.zip *
        cd ..

        echo "[-] Building boot.img structure..."
        mkdir -p boot_img_dir
        cp out/arch/arm64/boot/Image boot_img_dir/Image
        zip -r9 A04-Boot-Img-Final.zip boot_img_dir/
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: A04-Final-Kernel-Packages
        path: |
          A04-AnyKernel3-Final.zip
          A04-Boot-Img-Final.zip
