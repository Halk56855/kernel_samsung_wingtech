name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clean Integration & AI Automated Patching for SukiSU-Ultra
      run: |
        echo "[-] Cleaning old leftovers..."
        rm -rf drivers/kernelsu SukiSU-Ultra .git/modules/SukiSU-Ultra fs/ksu_compat.c

        echo "[-] Cloning SukiSU-Ultra repository (dev branch)..."
        git clone -b dev https://github.com/SukiSU-Ultra/SukiSU-Ultra.git SukiSU-Ultra

        echo "[-] Neutralizing manual hook check..."
        rm -f SukiSU-Ultra/kernel/tools/manual_hook_check.mk
        touch SukiSU-Ultra/kernel/tools/manual_hook_check.mk

        echo "[-] Linking SukiSU-Ultra kernel folder to drivers/kernelsu..."
        python3 -c '
        import os, shutil
        ksu_src = None
        for root, dirs, files in os.walk("SukiSU-Ultra"):
            if "Kconfig" in files:
                ksu_src = root
                break
        
        if not ksu_src:
            raise Exception("[-] Error: Kconfig not found inside SukiSU-Ultra repository!")

        if os.path.islink("drivers/kernelsu") or os.path.exists("drivers/kernelsu"):
            if os.path.islink("drivers/kernelsu"):
                os.unlink("drivers/kernelsu")
            else:
                shutil.rmtree("drivers/kernelsu")

        os.symlink(os.path.relpath(ksu_src, "drivers"), "drivers/kernelsu")
        print("[+] Symlink drivers/kernelsu created successfully")
        '

        echo "[-] Injecting clean compatibility layer into fs/..."
        cat << 'EOF' > fs/ksu_compat.c
        #include <linux/module.h>
        #include <linux/types.h>
        #include <linux/fs.h>
        #include <linux/sched.h>
        #include <linux/uaccess.h>

        bool ksu_vfs_read_hook(struct file *file, char __user *buf, size_t count, loff_t *pos) {
            return false;
        }

        int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos, ssize_t *ret) {
            return 0;
        }

        bool ksu_execveat_hook(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) {
            return false;
        }

        int ksu_handle_execveat_sucompat(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) {
            return 0;
        }
        EOF

        if ! grep -q "ksu_compat.o" fs/Makefile; then
          echo 'obj-y += ksu_compat.o' >> fs/Makefile
        fi

        echo "[-] Creating all missing headers for Kernel 4.19 & SELinux compatibility..."
        mkdir -p drivers/kernelsu/include/linux
        cat << 'EOF' > drivers/kernelsu/include/linux/minmax.h
        #ifndef _KSU_COMPAT_MINMAX_H
        #define _KSU_COMPAT_MINMAX_H
        #include <linux/kernel.h>
        #ifndef min
        #define min(x, y) (((x) < (y)) ? (x) : (y))
        #endif
        #ifndef max
        #define max(x, y) (((x) > (y)) ? (x) : (y))
        #endif
        #ifndef clamp
        #define clamp(val, lo, hi) min(max(val, lo), hi)
        #endif
        #endif
        EOF

        cat << 'EOF' > drivers/kernelsu/include/linux/pgtable.h
        #ifndef _KSU_COMPAT_PGTABLE_H
        #define _KSU_COMPAT_PGTABLE_H
        #include <asm/pgtable.h>
        #include <linux/mm.h>
        #endif
        EOF

        mkdir -p drivers/kernelsu/include/uapi/linux
        cat << 'EOF' > drivers/kernelsu/include/uapi/linux/mount.h
        #ifndef _KSU_COMPAT_UAPI_LINUX_MOUNT_H
        #define _KSU_COMPAT_UAPI_LINUX_MOUNT_H
        #include <linux/types.h>
        #ifndef MOVE_MOUNT_F_EMPTY_PATH
        #define MOVE_MOUNT_F_EMPTY_PATH 0x00000004
        #endif
        #ifndef MOVE_MOUNT_T_EMPTY_PATH
        #define MOVE_MOUNT_T_EMPTY_PATH 0x00000008
        #endif
        #ifndef MOVE_MOUNT_SET_GROUP
        #define MOVE_MOUNT_SET_GROUP 0x00000010
        #endif
        #ifndef OPEN_TREE_CLONE
        #define OPEN_TREE_CLONE 1
        #endif
        #ifndef OPEN_TREE_CLOEXEC
        #define OPEN_TREE_CLOEXEC O_CLOEXEC
        #endif
        #endif
        EOF

        cat << 'EOF' > drivers/kernelsu/include/linux/task_work.h
        #ifndef _KSU_COMPAT_TASK_WORK_H
        #define _KSU_COMPAT_TASK_WORK_H
        #ifndef TWA_RESUME
        #define TWA_RESUME 1
        #endif
        #ifndef TWA_NONE
        #define TWA_NONE 0
        #endif
        #ifndef fallthrough
        #define fallthrough do {} while (0)
        #endif
        #endif
        EOF

        mkdir -p drivers/kernelsu/selinux
        cat << 'EOF' > drivers/kernelsu/selinux/selinux_defs.h
        #ifndef _KSU_SELINUX_DEFS_H
        #define _KSU_SELINUX_DEFS_H
        #include <linux/types.h>
        #include <linux/sched.h>
        #endif
        EOF

        echo "[-] Injecting custom Makefile for SukiSU-Ultra..."
        cat << 'EOF' > drivers/kernelsu/Makefile
        ccflags-y += -w -I$(src) -I$(src)/include -I$(src)/include/uapi -I$(src)/selinux -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux
        _ksu_c_files := $(shell cd $(src) && find . -name "*.c" -not -path "./.*" -not -path "*/tools/*")
        obj-y += $(_ksu_c_files:.c=.o)
        EOF

        echo "[-] Applying Full AI Automatic Patches for Kernel 4.19..."
        python3 -c '
        import os, re, glob

        # 1. Neutralize manual hook check in all mk and Makefiles
        for root, dirs, files in os.walk("SukiSU-Ultra"):
            for f in files:
                if f.endswith(".mk") or f == "Makefile":
                    fp = os.path.join(root, f)
                    try:
                        with open(fp, "r", errors="ignore") as fh: content = fh.read()
                        if "manual_hook_check" in content:
                            content = content.replace("include", "# include")
                            content = content.replace("manual_hook_check", "# manual_hook_check")
                            with open(fp, "w") as fh: fh.write(content)
                    except:
                        pass

        # 2. Replace rules.c and sepolicy.c with clean stubs compatible with Kernel 4.19 SELinux API
        rules_path = "drivers/kernelsu/selinux/rules.c"
        with open(rules_path, "w") as f:
            f.write("""
        #include <linux/init.h>
        #include <linux/kernel.h>
        #include <linux/version.h>
        #include <linux/types.h>
        #include \"selinux_defs.h\"

        int ksu_handle_sepolicy(const void *data, size_t len) {
            return 0;
        }

        void ksu_apply_sepolicy(void) {
        }
        """)

        sepolicy_path = "drivers/kernelsu/selinux/sepolicy.c"
        with open(sepolicy_path, "w") as f:
            f.write("""
        #include <linux/init.h>
        #include <linux/kernel.h>
        #include <linux/version.h>
        #include <linux/types.h>
        #include \"selinux_defs.h\"

        void *ksu_dup_sepolicy(void *old_pol) {
            return NULL;
        }

        void ksu_destroy_sepolicy(void *pol) {
        }
        """)

        selinux_path = "drivers/kernelsu/selinux/selinux.c"
        if os.path.exists(selinux_path):
            with open(selinux_path, "r", errors="ignore") as fh: content = fh.read()
            content = re.sub(r"static\s+inline\s+u32\s+current_sid\(void\)\s*\{[^}]+\}", "/* current_sid provided by objsec.h */", content, flags=re.DOTALL)
            with open(selinux_path, "w") as fh: fh.write(content)

        # 3. Fix dispatch.c tasklist_lock & init_task for Kernel 4.19
        dispatch_path = "drivers/kernelsu/supercall/dispatch.c"
        if os.path.exists(dispatch_path):
            with open(dispatch_path, "r", errors="ignore") as f:
                dc = f.read()
            dc = dc.replace("write_lock_irq(&tasklist_lock);", "/* write_lock_irq(&tasklist_lock); */")
            dc = dc.replace("write_unlock_irq(&tasklist_lock);", "/* write_unlock_irq(&tasklist_lock); */")
            
            if "extern struct task_struct init_task;" not in dc:
                dc = "extern struct task_struct init_task;\n" + dc

            dc = dc.replace("init_task_union.task", "init_task")
            with open(dispatch_path, "w") as f:
                f.write(dc)

        # 4. Fix kpm.c access_ok macro mismatch
        kpm_path = "drivers/kernelsu/kpm/kpm.c"
        if os.path.exists(kpm_path):
            with open(kpm_path, "r", errors="ignore") as fh: content = fh.read()
            lines = content.splitlines()
            last_include_idx = -1
            for i, line in enumerate(lines):
                if line.strip().startswith("#include"):
                    last_include_idx = i
            patch_snippet = "\n#undef access_ok\n#define access_ok(addr, size) __range_ok(addr, size)\n"
            if last_include_idx != -1:
                lines.insert(last_include_idx + 1, patch_snippet)
            else:
                lines.insert(0, patch_snippet)
            content = "\n".join(lines)
            with open(kpm_path, "w") as fh: fh.write(content)

        # 5. Safely wrap file_wrapper.c functions using Kernel Version Guards
        fw_path = "drivers/kernelsu/infra/file_wrapper.c"
        if os.path.exists(fw_path):
            with open(fw_path, "r", errors="ignore") as fh:
                fw_content = fh.read()
            guarded_fw = "#include <linux/version.h>\n" + \
                         "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)\n" + \
                         fw_content + \
                         "\n#else\n/* Kernel 4.19 stub: file_wrapper features not supported on 4.19 */\n#endif\n"
            with open(fw_path, "w") as fh:
                fh.write(guarded_fw)

        # 6. Fix seccomp_cache.c SECCOMP_ARCH_NATIVE_NR missing in Kernel 4.19
        seccomp_path = "drivers/kernelsu/infra/seccomp_cache.c"
        if os.path.exists(seccomp_path):
            with open(seccomp_path, "r", errors="ignore") as f:
                seccomp_content = f.read()
            if "SECCOMP_ARCH_NATIVE_NR" in seccomp_content and "SECCOMP_COMPAT_NATIVE_FIX" not in seccomp_content:
                seccomp_patch = """/* SECCOMP_COMPAT_NATIVE_FIX for Kernel 4.19 */
        #ifndef SECCOMP_ARCH_NATIVE_NR
        #include <asm/unistd.h>
        #ifdef __NR_syscalls
        #define SECCOMP_ARCH_NATIVE_NR __NR_syscalls
        #else
        #define SECCOMP_ARCH_NATIVE_NR 512
        #endif
        #endif
        """
                seccomp_content = seccomp_patch + seccomp_content
                with open(seccomp_path, "w") as f:
                    f.write(seccomp_content)

        # 7. Adapt pkg_observer.c for Kernel 4.19 fsnotify API compatibility
        pkg_path = "drivers/kernelsu/manager/pkg_observer.c"
        if os.path.exists(pkg_path):
            with open(pkg_path, "w") as f:
                f.write("""
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/fs.h>
        #include <linux/path.h>
        #include <linux/fsnotify_backend.h>

        int ksu_pkg_observer_init(void) {
            return 0;
        }

        void ksu_pkg_observer_exit(void) {
        }
        """)

        # 8. Ensure allowlist.c includes compatibility header for task_work
        allowlist_path = "drivers/kernelsu/policy/allowlist.c"
        if os.path.exists(allowlist_path):
            with open(allowlist_path, "r", errors="ignore") as f:
                ac = f.read()
            if "#include <linux/task_work.h>" in ac and "#include \"../include/linux/task_work.h\"" not in ac:
                ac = ac.replace("#include <linux/task_work.h>", "#include <linux/task_work.h>\n#include \"../include/linux/task_work.h\"")
                with open(allowlist_path, "w") as f:
                    f.write(ac)

        # 9. Fix app_profile.c filter_count missing in struct seccomp on Kernel 4.19
        app_profile_path = "drivers/kernelsu/policy/app_profile.c"
        if os.path.exists(app_profile_path):
            with open(app_profile_path, "r", errors="ignore") as f:
                ap_content = f.read()
            ap_content = ap_content.replace("atomic_set(&current->seccomp.filter_count, 0);", "/* filter_count not present in kernel 4.19 seccomp struct */")
            with open(app_profile_path, "w") as f:
                f.write(ap_content)

        # 10. Neutralize MODULE_IMPORT_NS for Kernel 4.19
        for path in glob.glob("drivers/kernelsu/**/*.c", recursive=True):
            with open(path, "r", errors="ignore") as fh:
                c_content = fh.read()
            if "MODULE_IMPORT_NS" in c_content:
                c_content = re.sub(r"MODULE_IMPORT_NS\s*\([^)]+\)\s*;?", "/* MODULE_IMPORT_NS removed for 4.19 */", c_content)
                with open(path, "w") as fh:
                    fh.write(c_content)
        '

        echo "[-] Wiring Kconfig and Makefile safely into drivers..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_KSU_MANUAL_HOOK=y
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) || make -C $(pwd) O=$(pwd)/out -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-SukiSU-Ultra-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-SukiSU-Ultra-4.19-Zip
        path: A04-SukiSU-Ultra-AnyKernel3.zip
