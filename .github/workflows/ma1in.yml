name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Kernel Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git zip wget xz-utils device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Patch and Build Kernel
      run: |
        echo "[-] Cloning SukiSU-Ultra..."
        rm -rf drivers/kernelsu SukiSU-Ultra
        git clone -b dev https://github.com/SukiSU-Ultra/SukiSU-Ultra.git SukiSU-Ultra

        echo "[-] Setting up SukiSU-Ultra and Compatibility Layer for Kernel 4.19..."
        python3 -c '
        import os, shutil

        # البحث التلقائي عن مسار الكود داخل مستودع SukiSU-Ultra
        ksu_src = None
        for root, dirs, files in os.walk("SukiSU-Ultra"):
            if "Kconfig" in files:
                ksu_src = root
                break

        if not ksu_src:
            raise Exception("Kconfig not found in SukiSU-Ultra clone!")

        print(f"[+] Found KSU source at: {ksu_src}")

        # نسخ الملفات إلى drivers/kernelsu
        if os.path.exists("drivers/kernelsu"):
            shutil.rmtree("drivers/kernelsu")
        shutil.copytree(ksu_src, "drivers/kernelsu")

        # إنشاء ملف التوافقية للنواة 4.19
        compat_h_path = "drivers/kernelsu/ksu_compat.h"
        with open(compat_h_path, "w") as f:
            f.write("""#ifndef KSU_COMPAT_H
        #define KSU_COMPAT_H
        #define MODULE_IMPORT_NS(ns)
        #ifndef TWA_RESUME
        #define TWA_RESUME 1
        #endif
        #ifndef fallthrough
        #define fallthrough do {} while (0)
        #endif
        #endif
        """)

        # تعديل أو إنشاء الـ Makefile الخاص بـ KSU لإجبار تضمين ملف التوافقية
        makefile_path = "drivers/kernelsu/Makefile"
        if os.path.exists(makefile_path):
            with open(makefile_path, "r") as f:
                mf_content = f.read()
            
            if "ccflags-y" in mf_content:
                mf_content = mf_content.replace("ccflags-y +=", "ccflags-y += -include $(src)/ksu_compat.h")
            else:
                mf_content = "ccflags-y += -include $(src)/ksu_compat.h\n" + mf_content
            
            with open(makefile_path, "w") as f:
                f.write(mf_content)
        else:
            with open(makefile_path, "w") as f:
                f.write("""ccflags-y += -w -include $(src)/ksu_compat.h -I$(src)
        _ksu_c_files := $(shell cd $(src) && find . -name "*.c" -not -path "./.*" -not -path "*/tools/*")
        obj-y += $(_ksu_c_files:.c=.o)
        """)
        print("[+] Compatibility layer and Makefile configured successfully.")
        '

        echo "[-] Wiring Kconfig..."
        if ! grep -q "kernelsu" drivers/Kconfig; then echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig; fi
        if ! grep -q "kernelsu" drivers/Makefile; then echo 'obj-y += kernelsu/' >> drivers/Makefile; fi

        echo "[-] Setting up Toolchains..."
        mkdir -p toolchain/gcc toolchain/clang
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C toolchain/gcc
        
        GCC_PATH=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin
        export CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-
        export ARCH=arm64

        echo "[-] Configuring Kernel..."
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig
        
        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_KSU=y
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        CONFIG_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        EOT
        
        make -C $(pwd) O=$(pwd)/out olddefconfig

        echo "[-] Building Kernel..."
        make -C $(pwd) O=$(pwd)/out -j$(nproc)

    - name: Package Output
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../A04-Kernel-Final.zip *
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-Final-Kernel-Zip
        path: A04-Kernel-Final.zip
