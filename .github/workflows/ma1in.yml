name: Build A04 SukiSU
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev gcc clang make git wget xz-utils cpio lld
          rm -rf drivers/kernelsu && git clone -b dev https://github.com/SukiSU-Ultra/SukiSU-Ultra.git drivers/kernelsu
          find drivers/kernelsu -type f -name "*.c" -o -name "*.h" | xargs sed -i '/MODULE_IMPORT_NS/d'
          mkdir -p drivers/kernelsu/uapi drivers/kernelsu/linux
          echo -e "#ifndef __KSU_CSTDINT_H\n#define __KSU_CSTDINT_H\n#include <stdint.h>\n#endif" > drivers/kernelsu/cstdint
          echo -e "#ifndef KSU_COMPAT_H\n#define KSU_COMPAT_H\n#define TWA_RESUME 1\n#define fallthrough do {} while (0)\n#endif" > drivers/kernelsu/ksu_compat.h
          find drivers/kernelsu -name "*.h" -exec cp -u {} drivers/kernelsu/uapi/ \; 2>/dev/null || true
          echo 'ccflags-y += -w -include $(src)/ksu_compat.h -I$(src) -I$(src)/uapi' > drivers/kernelsu/Makefile
          echo 'obj-y += $(shell cd $(src) && find . -name "*.c" -not -path "./.*" | tr "\n" " " | sed "s/\.c/\.o/g")' >> drivers/kernelsu/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep -q "kernelsu" drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile
          mkdir -p toolchain/gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchain/gcc
          export CROSS_COMPILE=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-
          export ARCH=arm64
          export KCFLAGS="-w -Wno-error -I$(pwd)/drivers/kernelsu -I$(pwd)/drivers/kernelsu/uapi"
          make O=out rsuntk-a04_defconfig
          echo -e "CONFIG_KSU=y\nCONFIG_KPM=n\nCONFIG_KSU_SUSFS=n\nCONFIG_LTO=n\nCONFIG_LTO_CLANG=n\nCONFIG_KPROBES=y\nCONFIG_KALLSYMS=y\nCONFIG_SECURITY_SELINUX=y" >> out/.config
          make O=out olddefconfig && make O=out -j$(nproc)
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/ && cd AnyKernel3 && zip -r9 ../A04-AnyKernel3-Final.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: A04-Kernel-Package
          path: A04-AnyKernel3-Final.zip
