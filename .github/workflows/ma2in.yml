name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - KoWSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clean Integration of KoWSU & Complete Kernel 4.19 Compatibility Layer
      run: |
        cat << 'EOF' > setup_kernel.py
        import os, shutil, re

        print("[-] Cleaning up old remnants...")
        for p in ["drivers/kernelsu", "KernelSU-KoWSU", ".git/modules/KernelSU-KoWSU", "fs/ksu_compat.c"]:
            if os.path.islink(p) or os.path.isfile(p):
                os.remove(p)
            elif os.path.isdir(p):
                shutil.rmtree(p)

        print("[-] Cloning KernelSU-KoWSU repository...")
        os.system("git clone https://github.com/deepongi-labs/KernelSU-KoWSU.git KernelSU-KoWSU")

        print("[-] Creating global include/linux/pgtable.h for Kernel 4.19...")
        os.makedirs("include/linux", exist_ok=True)
        with open("include/linux/pgtable.h", "w") as f:
            f.write("#ifndef _COMPAT_LINUX_PGTABLE_H\n")
            f.write("#define _COMPAT_LINUX_PGTABLE_H\n")
            f.write("#include <asm/pgtable.h>\n")
            f.write("#include <linux/mm.h>\n")
            f.write("#include <linux/highmem.h>\n")
            f.write("#endif\n")

        print("[-] Creating clean file_wrapper.c for Kernel 4.19...")
        os.makedirs("drivers/kernelsu/infra", exist_ok=True)
        with open("drivers/kernelsu/infra/file_wrapper.c", "w") as f:
            f.write("#include <linux/module.h>\n")
            f.write("#include <linux/kernel.h>\n")
            f.write("#include <linux/fs.h>\n")
            f.write("#include <linux/version.h>\n")
            f.write("#include <linux/uaccess.h>\n")
            f.write("#include <linux/slab.h>\n\n")
            f.write("struct file *ksu_filp_open(const char *filename, int flags, umode_t mode) {\n")
            f.write("    return filp_open(filename, flags, mode);\n}\n\n")
            f.write("int ksu_filp_close(struct file *file, fl_owner_t id) {\n")
            f.write("    return filp_close(file, id);\n}\n\n")
            f.write("ssize_t ksu_kernel_read(struct file *file, void *buf, size_t count, loff_t *pos) {\n")
            f.write("    return kernel_read(file, buf, count, pos);\n}\n\n")
            f.write("ssize_t ksu_kernel_write(struct file *file, const void *buf, size_t count, loff_t *pos) {\n")
            f.write("    return kernel_write(file, buf, count, pos);\n}\n\n")
            f.write("bool ksu_vfs_read_hook(struct file *file, char __user *buf, size_t count, loff_t *pos) {\n")
            f.write("    return false;\n}\n\n")
            f.write("int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos, ssize_t *ret) {\n")
            f.write("    return 0;\n}\n")

        print("[-] Patching MODULE_IMPORT_NS in KoWSU...")
        for root, dirs, files in os.walk("KernelSU-KoWSU"):
            for file in files:
                if file.endswith((".c", ".h")):
                    path = os.path.join(root, file)
                    try:
                        with open(path, "r", encoding="utf-8", errors="ignore") as fx:
                            content = fx.read()
                        if "MODULE_IMPORT_NS" in content:
                            content = content.replace("MODULE_IMPORT_NS", "/* MODULE_IMPORT_NS */")
                            with open(path, "w", encoding="utf-8") as fx:
                                fx.write(content)
                    except Exception:
                        pass

        print("[-] Linking KernelSU-KoWSU...")
        ksu_src = None
        for root, dirs, files in os.walk("KernelSU-KoWSU"):
            if "Kconfig" in files:
                ksu_src = root
                break
        if not ksu_src:
            raise Exception("Kconfig not found!")
        
        target_link = "drivers/kernelsu"
        if os.path.islink(target_link) or os.path.exists(target_link):
            if os.path.islink(target_link):
                os.unlink(target_link)
            else:
                shutil.rmtree(target_link)
        os.symlink(os.path.relpath(ksu_src, "drivers"), target_link)

        print("[-] Injecting compatibility layer into fs/...")
        with open("fs/ksu_compat.c", "w") as f:
            f.write("#include <linux/module.h>\n")
            f.write("#include <linux/types.h>\n")
            f.write("#include <linux/fs.h>\n")
            f.write("#include <linux/sched.h>\n")
            f.write("#include <linux/uaccess.h>\n\n")
            f.write("bool ksu_vfs_read_hook(struct file *file, char __user *buf, size_t count, loff_t *pos) {\n    return false;\n}\n\n")
            f.write("int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos, ssize_t *ret) {\n    return 0;\n}\n\n")
            f.write("bool ksu_execveat_hook(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) {\n    return false;\n}\n\n")
            f.write("int ksu_handle_execveat_sucompat(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) {\n    return 0;\n}\n")

        with open("fs/Makefile", "r") as f:
            fs_mk = f.read()
        if "ksu_compat.o" not in fs_mk:
            with open("fs/Makefile", "a") as f:
                f.write("\nobj-y += ksu_compat.o\n")

        print("[-] Injecting custom Makefile for KernelSU-KoWSU...")
        with open("drivers/kernelsu/Makefile", "w") as f:
            f.write("ccflags-y += -w -I$(src) -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux\n")
            f.write("_ksu_c_files := $(shell cd $(src) && find . -name \"*.c\" -not -path \"./.*\" -not -path \"*/tools/*\")\n")
            f.write("obj-y += $(_ksu_c_files:.c=.o)\n")

        print("[-] Fixing SELinux files...")
        rules_path = "drivers/kernelsu/selinux/rules.c"
        if os.path.exists(rules_path):
            with open(rules_path, "r") as f: content = f.read()
            content = content.replace("selinux_status_update_policyload(0)", "selinux_status_update_policyload(&selinux_state, 0)")
            if "db = &policydb;" in content:
                content = content.replace("db = &policydb;", "extern struct policydb policydb;\n\tdb = &policydb;")
            else:
                content = re.sub(r"db\s*=\s*[^;]+;", "extern struct policydb policydb;\n\tdb = &policydb;", content)
            with open(rules_path, "w") as f: f.write(content)

        selinux_path = "drivers/kernelsu/selinux/selinux.c"
        if os.path.exists(selinux_path):
            with open(selinux_path, "r") as f: content = f.read()
            if '#include "selinux_defs.h"' not in content:
                content = '#include "selinux_defs.h"\n' + content
            content = re.sub(r"static\s+inline\s+u32\s+current_sid\(void\)\s*\{[^}]+\}", "/* current_sid provided by objsec.h */", content, flags=re.DOTALL)
            with open(selinux_path, "w") as f: f.write(content)

        print("[-] Wiring Kconfig and Makefile into drivers...")
        with open("drivers/Kconfig", "r") as f: kconfig_content = f.read()
        if 'source "drivers/kernelsu/Kconfig"' not in kconfig_content:
            with open("drivers/Kconfig", "a") as f: f.write('\nsource "drivers/kernelsu/Kconfig"\n')

        with open("drivers/Makefile", "r") as f: drv_mk = f.read()
        if 'obj-y += kernelsu/' not in drv_mk:
            with open("drivers/Makefile", "a") as f: f.write('\nobj-y += kernelsu/\n')
        EOF
        python3 setup_kernel.py

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_KSU_MANUAL_HOOK=y
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) || make -C $(pwd) O=$(pwd)/out -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KoWSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KoWSU-4.19-Zip
        path: A04-KoWSU-AnyKernel3.zip
