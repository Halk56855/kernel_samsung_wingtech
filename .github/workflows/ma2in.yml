name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - KoWSU - KOWX Repo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Download and Setup KoWSU Automatically
      run: |
        rm -rf drivers/kernelsu KernelSU .git/modules/KernelSU fs/ksu_compat.c
        git clone https://github.com/KOWX712/KernelSU.git KernelSU
        
        mkdir -p drivers/kernelsu
        cp -rf KernelSU/* drivers/kernelsu/

        if [ ! -f drivers/kernelsu/Kconfig ]; then
          cat << 'EOF' > drivers/kernelsu/Kconfig
        config KSU
            bool "KernelSU"
            default y

        config KSU_KPROBE_HOOKS
            bool "KernelSU kprobe hooks support"
            depends on KSU
            default y
        EOF
        fi

    - name: Fix file_wrapper.c and Patch init/main.c
      run: |
        find drivers/kernelsu -name "file_wrapper.c" -type f | while read fw; do
          cat << 'EOF' > "$fw"
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/fs.h>
        #include <linux/uaccess.h>
        void ksu_install_file_wrapper(void) {}
        void ksu_file_wrapper_init(void) {}
        EOF
        done

        sed -i '/extern void __init mm_init(void);/a extern void kernelsu_init(void);' init/main.c
        sed -i '/mm_init();/a \    kernelsu_init();' init/main.c

    - name: Create Compatibility Headers
      run: |
        mkdir -p include/linux include/uapi/linux
        cat << 'EOF' > include/linux/minmax.h
        #ifndef _LINUX_MINMAX_H
        #define _LINUX_MINMAX_H
        #define min(x, y) ({ typeof(x) _x = (x); typeof(y) _y = (y); _x < _y ? _x : _y; })
        #define max(x, y) ({ typeof(x) _x = (x); typeof(y) _y = (y); _x > _y ? _x : _y; })
        #endif
        EOF

        cat << 'EOF' > include/uapi/linux/mount.h
        #ifndef _UAPI_LINUX_MOUNT_H
        #define _UAPI_LINUX_MOUNT_H
        #ifndef MOUNT_ATTR_RDONLY
        #define MOUNT_ATTR_RDONLY 0x00000001
        #endif
        #endif
        EOF

        cat << 'EOF' > include/linux/pgtable.h
        #ifndef _COMPAT_LINUX_PGTABLE_H
        #define _COMPAT_LINUX_PGTABLE_H
        #include <asm/pgtable.h>
        #include <linux/mm.h>
        #include <linux/highmem.h>
        #endif
        EOF

    - name: Inject Compatibility Layer and Makefiles
      run: |
        cat << 'EOF' > fs/ksu_compat.c
        #include <linux/module.h>
        #include <linux/fs.h>
        #include <linux/sched.h>
        #include <linux/uaccess.h>
        #include <linux/input.h>
        
        long copy_to_kernel_nofault(void *dst, const void *src, size_t size) { memcpy(dst, src, size); return 0; }
        long copy_from_user_nofault(void *dst, const void __user *src, size_t size) { return copy_from_user(dst, src, size) ? -EFAULT : 0; }
        long copy_to_user_nofault(void __user *dst, const void *src, size_t size) { return copy_to_user(dst, src, size) ? -EFAULT : 0; }
        long strncpy_from_user_nofault(char *dst, const char __user *src, long count) { return strncpy_from_user(dst, src, count); }
        
        int ksu_handle_sys_reboot(int magic1, int magic2, int cmd, void __user *arg) { return 0; }
        bool ksu_handle_execveat(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) { return false; }
        int ksu_handle_devpts(struct inode *inode) { return 0; }
        void ksu_input_hook(struct input_handle *handle, unsigned int type, unsigned int code, int value) {}
        EOF

        if ! grep -q "ksu_compat.o" fs/Makefile; then
          echo 'obj-y += ksu_compat.o' >> fs/Makefile
        fi

        cat << 'EOF' > drivers/kernelsu/Makefile
        ccflags-y += -w -I$(srctree) -I$(src) -I$(src)/selinux -I$(srctree)/include/uapi
        _ksu_c_files := $(shell cd $(src) && find . -name "*.c" -not -path "./.*" -not -path "*/tools/*")
        obj-y += $(_ksu_c_files:.c=.o)
        EOF

        mkdir -p drivers/kernelsu/selinux
        cat << 'EOF' > drivers/kernelsu/selinux/rules.c
        #include <linux/kernel.h>
        int ksu_selinux_init(void) { return 0; }
        void ksu_apply_allow_rules(void) {}
        void apply_kernelsu_rules(void) {}
        int ksu_get_sepolicy_version(void) { return 0; }
        bool ksu_handle_selinux(void) { return false; }
        EOF

        cat << 'EOF' > drivers/kernelsu/selinux/sepolicy.c
        #include <linux/kernel.h>
        #include "sepolicy.h"
        void *ksu_dup_sepolicy(void *old_pol) { return NULL; }
        void ksu_destroy_sepolicy(void *pol) {}
        EOF

        if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi

        if ! grep -q 'obj-y += kernelsu/' drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git zip wget xz-utils device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q --show-progress https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q --show-progress https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables and PATH
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH
        echo "PATH=$CLANG_PATH:$PATH" >> $GITHUB_ENV

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=$CLANG_PATH/ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        export PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin:$PATH"
        
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_KSU=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig
        make -C $(pwd) O=$(pwd)/out -j$(nproc)

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../A04-KoWSU-Final.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KoWSU-Final-Zip
        path: A04-KoWSU-Final.zip
