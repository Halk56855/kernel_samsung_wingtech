name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - KoWSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clean and Clone KoWSU
      run: |
        rm -rf drivers/kernelsu KernelSU-KoWSU .git/modules/KernelSU-KoWSU fs/ksu_compat.c
        git clone https://github.com/deepongi-labs/KernelSU-KoWSU.git KernelSU-KoWSU

    - name: Fix file_wrapper.c for Kernel 4.19
      run: |
        find KernelSU-KoWSU -name "file_wrapper.c" -type f | while read fw; do
          echo "Overwriting $fw"
          cat << 'EOF' > "$fw"
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/fs.h>
        #include <linux/version.h>
        #include <linux/uaccess.h>
        #include <linux/slab.h>

        struct file *ksu_filp_open(const char *filename, int flags, umode_t mode) {
            return filp_open(filename, flags, mode);
        }

        int ksu_filp_close(struct file *file, fl_owner_t id) {
            return filp_close(file, id);
        }

        ssize_t ksu_kernel_read(struct file *file, void *buf, size_t count, loff_t *pos) {
            return kernel_read(file, buf, count, pos);
        }

        ssize_t ksu_kernel_write(struct file *file, const void *buf, size_t count, loff_t *pos) {
            return kernel_write(file, buf, count, pos);
        }

        bool ksu_vfs_read_hook(struct file *file, char __user *buf, size_t count, loff_t *pos) {
            return false;
        }

        int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos, ssize_t *ret) {
            return 0;
        }
        EOF
        done

    - name: Create linux/minmax.h compatibility header
      run: |
        mkdir -p include/linux
        cat << 'EOF' > include/linux/minmax.h
        #ifndef _LINUX_MINMAX_H
        #define _LINUX_MINMAX_H

        #include <linux/kernel.h>

        #define min(x, y) ({				\
            typeof(x) _min1 = (x);			\
            typeof(y) _min2 = (y);			\
            (void) (&_min1 == &_min2);		\
            _min1 < _min2 ? _min1 : _min2; })

        #define max(x, y) ({				\
            typeof(x) _max1 = (x);			\
            typeof(y) _max2 = (y);			\
            (void) (&_max1 == &_max2);		\
            _max1 > _max2 ? _max1 : _max2; })

        #define clamp(val, lo, hi) min(max(val, lo), hi)

        #endif
        EOF

    - name: Fix Kernel 4.19 Compatibility (seccomp_cache, pkg_observer, allowlist, app_profile, selinux, dispatch, supercall)
      run: |
        python3 - << 'EOF'
        import os
        for root, dirs, files in os.walk("KernelSU-KoWSU"):
            for file in files:
                path = os.path.join(root, file)
                if file == "seccomp_cache.c":
                    with open(path, "r") as f:
                        content = f.read()
                    if "SECCOMP_ARCH_NATIVE_NR" in content and "ifndef SECCOMP_ARCH_NATIVE_NR" not in content:
                        patch = "/* Define fallback for SECCOMP_ARCH_NATIVE_NR on Linux 4.19 */\n#ifndef SECCOMP_ARCH_NATIVE_NR\n#include <asm/unistd.h>\n#ifdef __NR_syscalls\n#define SECCOMP_ARCH_NATIVE_NR __NR_syscalls\n#else\n#define SECCOMP_ARCH_NATIVE_NR 512\n#endif\n#endif\n\n"
                        with open(path, "w") as f:
                            f.write(patch + content)
                        print("Patched seccomp_cache.c")
                elif file == "pkg_observer.c":
                    with open(path, "r") as f:
                        content = f.read()
                    if "handle_inode_event" in content:
                        content = content.replace("handle_inode_event", "handle_event")
                        with open(path, "w") as f:
                            f.write(content)
                        print("Patched pkg_observer.c")
                elif file == "app_profile.c":
                    with open(path, "r") as f:
                        content = f.read()
                    if "filter_count" in content:
                        content = content.replace("atomic_set(&current->seccomp.filter_count, 0);", "/* atomic_set(&current->seccomp.filter_count, 0); */")
                        with open(path, "w") as f:
                            f.write(content)
                        print("Patched app_profile.c for filter_count")
                elif file == "selinux.c":
                    with open(path, "r") as f:
                        content = f.read()
                    content = content.replace('#include "selinux_defs.h"', '#include "selinux/selinux_defs.h"')
                    with open(path, "w") as f:
                        f.write(content)
                    print("Patched selinux.c include path")
                elif file == "dispatch.c":
                    with open(path, "r") as f:
                        content = f.read()
                    if "init_task" in content and "extern struct task_struct init_task;" not in content:
                        patch = "#include <linux/spinlock.h>\n#include <linux/sched.h>\nextern struct task_struct init_task;\nextern rwlock_t tasklist_lock;\n"
                        content = patch + content
                        with open(path, "w") as f:
                            f.write(content)
                        print("Patched dispatch.c with required headers and declarations")
                
                if file.endswith(".c"):
                    with open(path, "r") as f:
                        content = f.read()
                    if "TWA_RESUME" in content and "ifndef TWA_RESUME" not in content and "#define TWA_RESUME" not in content:
                        patch = "#ifndef TWA_RESUME\n#define TWA_RESUME 1\n#endif\n\n"
                        content = patch + content
                        with open(path, "w") as f:
                            f.write(content)
                        print(f"Patched {file} for TWA_RESUME fallback")
        EOF

    - name: Create uapi/linux/mount.h compatibility header
      run: |
        mkdir -p include/uapi/linux
        cat << 'EOF' > include/uapi/linux/mount.h
        #ifndef _UAPI_LINUX_MOUNT_H
        #define _UAPI_LINUX_MOUNT_H

        #ifndef MOUNT_ATTR_RDONLY
        #define MOUNT_ATTR_RDONLY 0x00000001
        #endif
        #ifndef MOUNT_ATTR_NOSUID
        #define MOUNT_ATTR_NOSUID 0x00000002
        #endif
        #ifndef MOUNT_ATTR_NODEV
        #define MOUNT_ATTR_NODEV 0x00000004
        #endif
        #ifndef MOUNT_ATTR_NOEXEC
        #define MOUNT_ATTR_NOEXEC 0x00000008
        #endif

        #ifndef OPEN_TREE_CLONE
        #define OPEN_TREE_CLONE 1
        #endif
        #ifndef OPEN_TREE_CLOEXEC
        #define OPEN_TREE_CLOEXEC 02000000
        #endif

        #ifndef MOVE_MOUNT_F_SYMLINKS
        #define MOVE_MOUNT_F_SYMLINKS 0x00000001
        #endif
        #ifndef MOVE_MOUNT_F_AUTOMOUNT
        #define MOVE_MOUNT_F_AUTOMOUNT 0x00000002
        #endif
        #ifndef MOVE_MOUNT_F_EMPTY_PATH
        #define MOVE_MOUNT_F_EMPTY_PATH 0x00000004
        #endif

        #endif
        EOF

    - name: Create pgtable.h compatibility header
      run: |
        mkdir -p include/linux
        cat << 'EOF' > include/linux/pgtable.h
        #ifndef _COMPAT_LINUX_PGTABLE_H
        #define _COMPAT_LINUX_PGTABLE_H
        #include <asm/pgtable.h>
        #include <linux/mm.h>
        #include <linux/highmem.h>
        #endif
        EOF

    - name: Patch MODULE_IMPORT_NS
      run: |
        find KernelSU-KoWSU -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/MODULE_IMPORT_NS/\/\* MODULE_IMPORT_NS \*\//g' {} +

    - name: Link KoWSU to drivers
      run: |
        python3 - << 'EOF'
        import os, shutil
        ksu_src = None
        for root, dirs, files in os.walk("KernelSU-KoWSU"):
            if "Kconfig" in files:
                ksu_src = root
                break
        if not ksu_src:
            raise Exception("Kconfig not found!")
        target_link = "drivers/kernelsu"
        if os.path.islink(target_link) or os.path.exists(target_link):
            if os.path.islink(target_link):
                os.unlink(target_link)
            else:
                shutil.rmtree(target_link)
        os.symlink(os.path.relpath(ksu_src, "drivers"), target_link)
        EOF

    - name: Inject fs compatibility layer
      run: |
        cat << 'EOF' > fs/ksu_compat.c
        #include <linux/module.h>
        #include <linux/types.h>
        #include <linux/fs.h>
        #include <linux/sched.h>
        #include <linux/uaccess.h>

        bool ksu_vfs_read_hook(struct file *file, char __user *buf, size_t count, loff_t *pos) {
            return false;
        }

        int ksu_handle_vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos, ssize_t *ret) {
            return 0;
        }

        bool ksu_execveat_hook(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) {
            return false;
        }

        int ksu_handle_execveat_sucompat(int *dfd, struct filename **filename, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags) {
            return 0;
        }
        EOF

        if ! grep -q "ksu_compat.o" fs/Makefile; then
          echo 'obj-y += ksu_compat.o' >> fs/Makefile
        fi

    - name: Inject KoWSU Makefile
      run: |
        cat << 'EOF' > drivers/kernelsu/Makefile
        ccflags-y += -w -I$(srctree) -I$(src) -I$(src)/selinux -I$(srctree)/include/uapi -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include -I$(srctree)/security/selinux/ss -I$(objtree)/security/selinux -I$(objtree)/security/selinux/ss
        _ksu_c_files := $(shell cd $(src) && find . -name "*.c" -not -path "./.*" -not -path "*/tools/*")
        obj-y += $(_ksu_c_files:.c=.o)
        EOF

    - name: Provide Clean 4.19 Compatible rules.c and sepolicy.c for SELinux
      run: |
        python3 - << 'EOF'
        import os

        rules_path = "drivers/kernelsu/selinux/rules.c"
        os.makedirs(os.path.dirname(rules_path), exist_ok=True)
        with open(rules_path, "w") as f:
            f.write('''
            #include <linux/kernel.h>
            #include <linux/init.h>
            #include <linux/types.h>

            int ksu_selinux_init(void) {
                return 0;
            }

            void ksu_apply_allow_rules(void) {
            }

            int ksu_get_sepolicy_version(void) {
                return 0;
            }

            bool ksu_handle_selinux(void) {
                return false;
            }
            ''')

        sepolicy_path = "drivers/kernelsu/selinux/sepolicy.c"
        with open(sepolicy_path, "w") as f:
            f.write('''
            #include <linux/kernel.h>
            #include <linux/init.h>
            #include <linux/types.h>
            #include "sepolicy.h"

            struct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *old_pol) {
                return NULL;
            }

            void ksu_destroy_sepolicy(struct selinux_policy *pol) {
            }
            ''')

        selinux_path = "drivers/kernelsu/selinux/selinux.c"
        if os.path.exists(selinux_path):
            with open(selinux_path, "r") as f: content = f.read()
            import re
            content = re.sub(r"static\s+inline\s+u32\s+current_sid\(void\)\s*\{[^}]+\}", "/* current_sid provided by objsec.h */", content, flags=re.DOTALL)
            with open(selinux_path, "w") as f: f.write(content)
        EOF

        if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi

        if ! grep -q 'obj-y += kernelsu/' drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd) -I$(pwd)/include -I$(pwd)/include/uapi -I$(pwd)/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_KSU_MANUAL_HOOK=y
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) || make -C $(pwd) O=$(pwd)/out -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KoWSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KoWSU-4.19-Zip
        path: A04-KoWSU-AnyKernel3.zip
