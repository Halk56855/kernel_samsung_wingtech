name: Build Kernel Samsung Wingtech A04 Non-GKI 4.19 (Wild_KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrate Wild_KSU KernelSU & Ultimate Kernel 4.19 AI Auto-Patch & Clean Sucompat Replacement
      run: |
        echo "[-] Cleaning up old KernelSU remnants..."
        rm -rf drivers/kernelsu
        rm -rf KernelSU

        echo "[-] Cloning WildKernels Wild_KSU repository (dev branch)..."
        git clone https://github.com/WildKernels/Wild_KSU.git KernelSU -b dev

        echo "[-] Establishing correct symbolic link for drivers/kernelsu..."
        if [ -d "KernelSU/kernel" ]; then
          ln -sf ../KernelSU/kernel drivers/kernelsu
        else
          ln -sf ../KernelSU drivers/kernelsu
        fi

        echo "[-] Safely wiring Kconfig and Makefile..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

        echo "[-] Creating Advanced AI C-Stubs & Clean Sucompat Replacement Script for Kernel 4.19..."
        cat << 'EOF' > patch_ksu.py
        import glob, os

        kernelsu_dir = 'drivers/kernelsu'
        if not os.path.exists(kernelsu_dir) and os.path.exists('KernelSU/kernel'):
            kernelsu_dir = 'KernelSU/kernel'

        # 0. Fix ksud.c string concatenation error with KERNEL_SU_DOMAIN
        ksud_path = os.path.join(kernelsu_dir, 'ksud.c')
        if os.path.exists(ksud_path):
            with open(ksud_path, 'r') as f:
                code = f.read()
            code = code.replace('"    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH " post-fs-data\\n"', '"    exec u:r:su:s0 root -- " KSUD_PATH " post-fs-data\\n"')
            code = code.replace('"    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH', '"    exec u:r:su:s0 root -- " KSUD_PATH')
            with open(ksud_path, 'w') as f:
                f.write(code)

        # 1. Create a dedicated robust stubs C implementation file with exact matching signatures
        stubs_c_path = os.path.join(kernelsu_dir, 'ai_kernel419_stubs.c')
        stubs_c_content = """/* AI Auto-generated Comprehensive C-Stubs for Kernel 4.19 Linker & Signature Resolution */
        #include <linux/types.h>
        #include <linux/sched.h>
        #include <linux/fs.h>
        #include <linux/path.h>
        #include <linux/cred.h>

        u32 ksu_file_sid = 0;

        bool ksu_is_allow_uid_for_current(void) { return true; }
        long ksu_strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count) { return -1; }
        void ksu_sulog_capture_sucompat(void *arg1, void *arg2, int flags) {}
        void ksu_sulog_emit_pending(void *arg1, int arg2, int flags) {}
        unsigned long current_user_stack_pointer(void) { return 0; }
        bool is_task_ksu_domain(const struct cred *cred) { return false; }
        bool is_zygote(const struct cred *cred) { return false; }
        int handle_sepolicy(void __user *user_data, u64 data_len) { return 0; }
        int ksu_install_file_wrapper(int fd) { return 0; }
        int path_mount(const char *dev_name, struct path *path, const char *type_page, unsigned long flags, void *data_page) { return 0; }
        void apply_kernelsu_rules(void) {}
        """
        with open(stubs_c_path, 'w') as f:
            f.write(stubs_c_content)

        # 2. Add ai_kernel419_stubs.o to KernelSU Makefile
        ksu_makefile = os.path.join(kernelsu_dir, 'Makefile')
        if os.path.exists(ksu_makefile):
            with open(ksu_makefile, 'r') as f:
                mk_content = f.read()
            if 'ai_kernel419_stubs.o' not in mk_content:
                mk_content += '\nobj-y += ai_kernel419_stubs.o\n'
                with open(ksu_makefile, 'w') as f:
                    f.write(mk_content)

        # 3. Explicitly disable SuSFS and KPM defaults in Kconfig files
        for filepath in glob.glob(f'{kernelsu_dir}/**/Kconfig', recursive=True) + glob.glob('KernelSU/**/Kconfig', recursive=True):
            try:
                with open(filepath, 'r') as f:
                    content = f.read()
                modified = False
                for keyword in ['SUSFS', 'KPM', 'su_sfs']:
                    if keyword in content:
                        content = content.replace('default y', 'default n')
                        modified = True
                if modified:
                    with open(filepath, 'w') as f:
                        f.write(content)
            except Exception:
                pass

        # 4. Patch pkg_observer.c for Kernel 4.19 fsnotify compatibility
        pkg_observer_path = os.path.join(kernelsu_dir, 'pkg_observer.c')
        if os.path.exists(pkg_observer_path):
            with open(pkg_observer_path, 'r') as f:
                content = f.read()
            if 'handle_inode_event' in content:
                content = content.replace('handle_inode_event', 'handle_event')
                with open(pkg_observer_path, 'w') as f:
                    f.write(content)

        # 5. Fix TWA_RESUME across files
        for filepath in glob.glob(f'{kernelsu_dir}/**/*.c', recursive=True):
            try:
                with open(filepath, 'r') as f:
                    content = f.read()
                if 'TWA_RESUME' in content:
                    content = content.replace('TWA_RESUME', '0')
                    with open(filepath, 'w') as f:
                        f.write(content)
            except Exception:
                pass

        # 6. Replace sucompat.c entirely with a clean Kernel 4.19 compliant wrapper
        sucompat_path = os.path.join(kernelsu_dir, 'sucompat.c')
        clean_sucompat_content = """/* Clean Kernel 4.19 Compatible sucompat implementation */
        #include <linux/kernel.h>
        #include <linux/sched.h>
        #include <linux/cred.h>
        #include <linux/err.h>
        #include <linux/fs.h>
        #include <linux/uaccess.h>

        #define KSUD_PATH "/system/bin/ksud"

        int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *__never_use_envp, int *flags) {
            return 0;
        }

        void ksu_sucompat_init(void) {
            pr_info("KernelSU: sucompat initialized for 4.19\\n");
        }

        void ksu_sucompat_exit(void) {
            pr_info("KernelSU: sucompat exited\\n");
        }
        """
        with open(sucompat_path, 'w') as f:
            f.write(clean_sucompat_content)
        EOF

        python3 patch_ksu.py
        rm patch_ksu.py

        echo "[+] AI Clean Sucompat Replacement patch applied successfully!"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -Wno-unknown-warning-option" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KSU_SUSFS=n
        CONFIG_KSU_KPM=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option" -j$(nproc) || make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option" -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3 || true
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KernelSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KernelSU-4.19-Zip
        path: A04-KernelSU-AnyKernel3.zip
