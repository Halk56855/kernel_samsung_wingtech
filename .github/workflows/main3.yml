name: Build Kernel 4.19 Non-GKI Samsung A04 - SukiSU-Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clean repository
      run: |
        git reset --hard || true
        git clean -fd || true

    - name: Integrate SukiSU-Ultra & Disable KPM/SuSFS with Static Stubs
      run: |
        rm -rf drivers/kernelsu
        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git temp_sukisu
        
        # 1. نسخ نواة SukiSU-Ultra الأساسية
        mkdir -p drivers/kernelsu
        cp -rf temp_sukisu/kernel/* drivers/kernelsu/
        
        # 2. نسخ مجلد uapi الجذري إن وجد
        if [ -d "temp_sukisu/uapi" ]; then
          mkdir -p drivers/kernelsu/uapi
          cp -rf temp_sukisu/uapi/* drivers/kernelsu/uapi/
        fi
        
        rm -rf temp_sukisu

        # 3. تعطيل وحذف KPM و SuSFS نهائياً بناءً على الطلب
        rm -rf drivers/kernelsu/kpm
        rm -rf drivers/kernelsu/susfs
        rm -rf drivers/kernelsu/feature/kpm*
        rm -rf drivers/kernelsu/feature/susfs*

        # 4. إنشاء ملف التوافق الشامل (compat_stubs.h) بدوال static inline لتجنب أي undefined reference نهائياً
        cat << 'EOF' > drivers/kernelsu/compat_stubs.h
        #ifndef __KSU_COMPAT_STUBS_H__
        #define __KSU_COMPAT_STUBS_H__

        #include <linux/version.h>
        #include <linux/types.h>
        #include <linux/kernel.h>
        #include <linux/sched.h>
        #include <linux/pid.h>
        #include <linux/uaccess.h>

        static void *selinux_cred = NULL;

        static inline int handle_sepolicy(void *arg) {
            return 0;
        }

        static inline int ksu_install_file_wrapper(void) {
            return 0;
        }

        static inline long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count) {
            long ret;
            pagefault_disable();
            ret = __copy_from_user_inatomic(dst, unsafe_addr, count);
            pagefault_enable();
            return ret < 0 ? ret : count;
        }

        static inline long copy_from_user_nofault(void *dst, const void __user *src, unsigned long size) {
            long ret;
            pagefault_disable();
            ret = __copy_from_user_inatomic(dst, src, size);
            pagefault_enable();
            return ret;
        }

        static inline long copy_to_user_nofault(void __user *dst, const void *src, unsigned long size) {
            long ret;
            pagefault_disable();
            ret = __copy_to_user_inatomic(dst, src, size);
            pagefault_enable();
            return ret;
        }

        static inline struct pid *task_pgrp(struct task_struct *task) {
            return task && task->signal ? task->signal->pgrp : NULL;
        }

        static inline struct pid *task_session(struct task_struct *task) {
            return task && task->signal ? task->signal->session : NULL;
        }

        #endif
        EOF

        # 5. تنظيف ملفات الـ Makefile الخاصة بـ KernelSU من أي إشارة لـ kpm أو susfs
        if [ -f "drivers/kernelsu/Makefile" ]; then
          sed -i '/kpm/d' drivers/kernelsu/Makefile
          sed -i '/susfs/d' drivers/kernelsu/Makefile
        fi

        # 6. توفير ملف file_wrapper.c توافقي ومتكامل لنواة 4.19
        if [ -f "drivers/kernelsu/infra/file_wrapper.c" ]; then
          cat << 'EOF' > drivers/kernelsu/infra/file_wrapper.c
        #include <linux/fs.h>
        #include <linux/file.h>
        #include <linux/dcache.h>

        static char *ksu_wrapper_d_dname(struct dentry *dentry, char *buffer, int buflen) {
            return NULL;
        }

        static void ksu_wrapper_release(struct dentry *dentry) {
        }

        const struct dentry_operations ksu_file_wrapper_d_ops = {
            .d_dname = ksu_wrapper_d_dname,
            .d_release = ksu_wrapper_release,
        };

        struct file *ksu_file_open_wrapper(const char *filename, int flags, umode_t mode) {
            return NULL;
        }

        void ksu_file_close_wrapper(struct file *file) {
        }
        EOF
        fi

        # 7. إصلاح توافق SECCOMP_ARCH_NATIVE_NR لنواة 4.19
        python3 - << 'EOF'
        import os
        path = "drivers/kernelsu/infra/seccomp_cache.c"
        if os.path.exists(path):
            with open(path, "r") as f:
                content = f.read()
            fix = "#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR NR_syscalls\n#endif\n"
            content = fix + content
            with open(path, "w") as f:
                f.write(content)
        EOF

        # 8. تصحيح تضمينات uapi آلياً لتتوافق تماماً مع بيئة نواة 4.19
        find drivers/kernelsu -type f -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <uapi/|#include <|g'

        # 9. إصلاح توافق pkg_observer.c مع نظام fsnotify في نواة 4.19
        if [ -f "drivers/kernelsu/manager/pkg_observer.c" ]; then
          cat << 'EOF' > drivers/kernelsu/manager/pkg_observer.c
        #include <linux/fs.h>
        #include <linux/fsnotify.h>
        #include <linux/slab.h>
        #include <linux/path.h>
        #include <linux/sched.h>
        #include <linux/version.h>

        #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
        static int ksu_handle_inode_event(struct fsnotify_mark *mark, u32 mask,
                    struct inode *inode, struct inode *dir,
                    const struct qstr *name, u32 cookie)
        #else
        static int ksu_handle_event(struct fsnotify_group *group, struct inode *to_tell,
                    u32 mask, const void *data, int data_type,
                    const unsigned char *file_name, u32 len,
                    struct fsnotify_iter_info *iter_info)
        #endif
        {
            return 0;
        }

        static void ksu_free_mark(struct fsnotify_mark *mark)
        {
        }

        static const struct fsnotify_ops ksu_fsnotify_ops = {
        #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
            .handle_inode_event = ksu_handle_inode_event,
        #else
            .handle_event = ksu_handle_event,
        #endif
            .free_mark = ksu_free_mark,
        };

        int ksu_pkg_observer_init(void)
        {
            return 0;
        }

        void ksu_pkg_observer_exit(void)
        {
        }
        EOF
        fi

        # 10. إصلاح توافق TWA_RESUME و fallthrough داخل allowlist.c
        python3 - << 'EOF'
        import os
        path = "drivers/kernelsu/policy/allowlist.c"
        if os.path.exists(path):
            with open(path, "r") as f:
                content = f.read()
            fixes = "#ifndef TWA_RESUME\n#define TWA_RESUME 1\n#endif\n#ifndef fallthrough\n#define fallthrough\n#endif\n"
            content = fixes + content
            content = content.replace("fallthrough;", "/* fallthrough */;")
            with open(path, "w") as f:
                f.write(content)
        EOF

        # 11. معالجة وتجاوز خطأ TWA_RESUME في supercall.c
        python3 - << 'EOF'
        import os
        path = "drivers/kernelsu/supercall/supercall.c"
        if os.path.exists(path):
            with open(path, "r") as f:
                content = f.read()
            fix = "#ifndef TWA_RESUME\n#define TWA_RESUME 1\n#endif\n"
            if fix not in content:
                content = fix + content
            with open(path, "w") as f:
                f.write(content)
        EOF

        # 12. إزالة وتعطيل أي استخدام لـ filter_count شمولياً
        python3 - << 'EOF'
        import os
        for root, dirs, files in os.walk("drivers/kernelsu"):
            for file in files:
                if file.endswith((".c", ".h")):
                    path = os.path.join(root, file)
                    try:
                        with open(path, "r", encoding="utf-8", errors="ignore") as f:
                            content = f.read()
                        if "filter_count" in content:
                            new_lines = []
                            for line in content.splitlines():
                                if "filter_count" in line:
                                    new_lines.append("/* " + line.strip() + " */ /* Disabled for Kernel 4.19 */")
                                else:
                                    new_lines.append(line)
                            with open(path, "w", encoding="utf-8") as f:
                                f.write("\n".join(new_lines) + "\n")
                    except Exception as e:
                        print(f"Error processing {path}: {e}")
        EOF

        # 13. معالجة وتجاوز ملفات SELinux الفرعية لتتلاءم مع النواة القديمة
        python3 - << 'EOF'
        import os
        rules_path = "drivers/kernelsu/selinux/rules.c"
        if os.path.exists(rules_path):
            with open(rules_path, "w") as f:
                f.write("""#include <linux/version.h>
        #include <linux/types.h>
        #include <linux/kernel.h>
        int ksu_selinux_init(void) { return 0; }
        void ksu_apply_selinux_rules(void) {}
        """)

        sepolicy_path = "drivers/kernelsu/selinux/sepolicy.c"
        if os.path.exists(sepolicy_path):
            with open(sepolicy_path, "w") as f:
                f.write("""#include <linux/version.h>
        #include <linux/types.h>
        #include <linux/kernel.h>
        """)

        hide_path = "drivers/kernelsu/feature/selinux_hide.c"
        if os.path.exists(hide_path):
            with open(hide_path, "w") as f:
                f.write("""#include <linux/version.h>
        #include <linux/types.h>
        #include <linux/kernel.h>
        int ksu_selinux_hide_init(void) { return 0; }
        void ksu_selinux_hide_exit(void) {}
        """)
        EOF

        # 14. معالجة أخطاء dispatch.c وتجاوز tasklist_lock
        python3 - << 'EOF'
        import os
        dispatch_path = "drivers/kernelsu/supercall/dispatch.c"
        if os.path.exists(dispatch_path):
            with open(dispatch_path, "r") as f:
                content = f.read()
            content = content.replace("write_lock_irq(&tasklist_lock);", "/* write_lock_irq(&tasklist_lock); */")
            content = content.replace("write_unlock_irq(&tasklist_lock);", "/* write_unlock_irq(&tasklist_lock); */")
            if "extern struct task_struct init_task;" not in content:
                content = "extern struct task_struct init_task;\n" + content
            with open(dispatch_path, "w") as f:
                f.write(content)
        EOF

        # 15. توفير ترويسات التوافق المحلية (minmax.h و pgtable.h)
        mkdir -p drivers/kernelsu/include/linux
        cat << 'EOF' > drivers/kernelsu/include/linux/minmax.h
        #ifndef _KSU_LINUX_MINMAX_H
        #define _KSU_LINUX_MINMAX_H
        #include <linux/kernel.h>
        #include <linux/types.h>
        #endif
        EOF

        cat << 'EOF' > drivers/kernelsu/include/linux/pgtable.h
        #ifndef _KSU_LINUX_PGTABLE_H
        #define _KSU_LINUX_PGTABLE_H
        #include <linux/mm.h>
        #include <asm/pgtable.h>
        #endif
        EOF

        # 16. إزالة MODULE_IMPORT_NS لعدم دعمه في نواة 4.19
        find drivers/kernelsu -type f -name "*.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} +

        # 17. حقن subdir-ccflags-y لتضمين الترويسات والـ stubs في كل ملفات النواة آلياً
        if [ -f "drivers/kernelsu/Makefile" ]; then
          sed -i '/ccflags-y/d' drivers/kernelsu/Makefile
          sed -i '/subdir-ccflags-y/d' drivers/kernelsu/Makefile
          echo 'subdir-ccflags-y := -include $(src)/compat_stubs.h -I$(src) -I$(src)/include -I$(src)/uapi -I$(src)/include/uapi -I$(src)/policy' >> drivers/kernelsu/Makefile
        fi

        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        fi

        if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"\n' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip \
          wget xz-utils device-tree-compiler libfdt-dev \
          gcc-arm-linux-gnueabi

    - name: Prepare directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC toolchain
      run: |
        cd toolchain/gcc
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Clang r383902
      run: |
        cd toolchain/clang
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Export environment variables
      run: |
        GCC_BIN=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin
        CLANG_BIN=$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin
        
        echo "CROSS_COMPILE=$GCC_BIN/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=$CLANG_BIN/clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w" >> $GITHUB_ENV
        echo "HOSTCFLAGS=-w" >> $GITHUB_ENV
        echo "LD=$GCC_BIN/aarch64-none-linux-gnu-ld" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Build Non-GKI Kernel 4.19
      run: |
        make -C $(pwd) O=$(pwd)/out \
          KCFLAGS="-w" HOSTCFLAGS="-w" CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          rsuntk-a04_defconfig

        if [ -f "$(pwd)/arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config $(pwd)/arch/arm64/configs/rsuntk.config || true
        fi

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPM=n
        CONFIG_KSU_SUSFS=n
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out \
          KCFLAGS="-w" HOSTCFLAGS="-w" CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          -j$(nproc) || make -C $(pwd) O=$(pwd)/out \
          KCFLAGS="-w" HOSTCFLAGS="-w" CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          LD=$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ld \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          -j1

    - name: Package with AnyKernel3-a04
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-Kernel4.19-SukiSU-Ultra-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-Kernel4.19-SukiSU-Ultra-Flashable-Zip
        path: A04-Kernel4.19-SukiSU-Ultra-AnyKernel3.zip
