name: Build and Package Samsung Galaxy A04 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc yasm zlib1g-dev python3 make xz-utils zip unzip

      - name: Setup SukiSU-Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Setup Toolchains
        run: |
          echo "=== استنساخ أدوات التجميع (Toolchains) ==="
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-19.1 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git -b lineage-19.1 gcc32
          git clone --depth=1 https://gitlab.com/LeCmnGendarme/aarch64-linux-android-gla.git -b 14 clang || true

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export PATH="${{ github.workspace }}/clang/bin:${{ github.workspace }}/gcc64/bin:${{ github.workspace }}/gcc32/bin:$PATH"
          
          OUT_DIR="out"
          mkdir -p $OUT_DIR
          
          echo "=== تنظيف ملفات النظام القديمة ==="
          make O=$OUT_DIR mrproper
          
          echo "=== تطبيق ملف التكوين (Defconfig) ==="
          make O=$OUT_DIR rsuntk-a04_defconfig
          
          echo "=== بدء تجميع النواة ==="
          make -j$(nproc --all) \
            O=$OUT_DIR \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          echo "=== استنساخ مستودع AnyKernel3 المخصص للهاتف ==="
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          
          echo "=== نسخ ملفات النواة الناتجة إلى مجلد AnyKernel3 ==="
          cp out/arch/arm64/boot/Image AnyKernel3/
          # إذا كانت هناك ملفات dtb أو dtbo مطلوبة:
          [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          echo "=== ضغط الملفات لتوليد ملف التفليش النهائي ==="
          cd AnyKernel3
          zip -r9 ../Galaxy-A04-SukiSU-Flashable.zip * -x ".git*" README.md LICENSE

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-SukiSU-Flashable-Zip
          path: Galaxy-A04-SukiSU-Flashable.zip
