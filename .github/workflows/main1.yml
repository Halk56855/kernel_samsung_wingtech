name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - KittiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrate KittiSU & Proper Wiring
      run: |
        echo "[-] Cleaning up old KittiSU remnants..."
        rm -rf drivers/kernelsu KittiSU

        echo "[-] Cloning KittiSU repository..."
        git clone https://github.com/terebiko/KittiSU.git KittiSU -b testing

        echo "[-] Neutralizing KittiSU integration check scripts for Non-GKI environment..."
        find KittiSU/kernel/tools -name "*.mk" -exec truncate -s 0 {} \; || true

        echo "[-] Establishing correct symbolic link for drivers/kernelsu..."
        if [ -d "KittiSU/kernel" ]; then
          ln -sf ../KittiSU/kernel drivers/kernelsu
        else
          ln -sf ../KittiSU drivers/kernelsu
        fi

        echo "[-] Safely wiring Kconfig and Makefile..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

        echo "[-] Applying robust Python patches for KittiSU hooks & symbols..."
        python3 -c '
        import os, re
        
        # 1. Force obj-y for KittiSU
        for r, ds, fs in os.walk("drivers/kernelsu"):
            for f in fs:
                if f in ("Makefile", "Kbuild") or f.endswith(".mk"):
                    fp = os.path.join(r, f)
                    with open(fp, "r") as fh: c = fh.read()
                    c = re.sub(r"obj-\$\([^)]+\)", "obj-y", c)
                    c = re.sub(r"obj-\$[A-Za-z0-9_]+", "obj-y", c)
                    with open(fp, "w") as fh: fh.write(c)

        # 2. Patch avc_has_perm and is_selinux_disabled
        for r, ds, fs in os.walk("drivers/kernelsu"):
            for f in fs:
                if f.endswith((".c", ".h")):
                    fp = os.path.join(r, f)
                    with open(fp, "r") as fh: c = fh.read()
                    m = False
                    if "avc_has_perm" in c:
                        c = re.sub(r"avc_has_perm\s*\(([^)]+)\)", lambda x: f"avc_has_perm(&selinux_state, {x.group(1)})" if "&selinux_state" not in x.group(1) else x.group(0), c)
                        m = True
                    if "is_selinux_disabled" in c:
                        c = re.sub(r"#define\s+is_selinux_disabled\s*\([^)]*\).*", "#define is_selinux_disabled() 0", c)
                        m = True
                    if m:
                        with open(fp, "w") as fh: fh.write(c)

        # 3. Fix selinux.c
        ps = "drivers/kernelsu/selinux/selinux.c"
        if os.path.exists(ps):
            with open(ps, "r") as fh: c = fh.read()
            if "extern int selinux_enforcing;" not in c: c = "extern int selinux_enforcing;\n" + c
            if "static inline u32 current_sid(void)" in c:
                c = c.replace("static inline u32 current_sid(void)", "static inline u32 ksu_current_sid(void)")
                c = c.replace("current_sid()", "ksu_current_sid()")
            with open(ps, "w") as fh: fh.write(c)

        # 4. Inject comprehensive weak fallbacks for all missing ksu hooks in rules.c to prevent linker crashes
        pr = "drivers/kernelsu/selinux/rules.c"
        if os.path.exists(pr):
            with open(pr, "r") as fh: rc = fh.read()
            rc = rc.replace("selinux_status_update_policyload(0)", "selinux_status_update_policyload(&selinux_state, 0)")
            rc = rc.replace("selinux_status_update_policyload( 0 )", "selinux_status_update_policyload(&selinux_state, 0)")
            
            hooks_fallback = """
#ifndef __KSU_ALL_WEAK_DEFS_H__
#define __KSU_ALL_WEAK_DEFS_H__
__attribute__((weak)) struct policydb policydb;
__attribute__((weak)) int selinux_enforcing;
__attribute__((weak)) bool ksu_vfs_read_hook(void *file, char __user *buf, size_t count, loff_t *pos) { return false; }
__attribute__((weak)) void ksu_handle_vfs_read(void *file, char __user *buf, size_t count, loff_t *pos) {}
__attribute__((weak)) bool ksu_execveat_hook(int *fd, struct filename **filename, void *argv, void *envp, int *flags) { return false; }
__attribute__((weak)) void ksu_handle_execveat_sucompat(int *fd, struct filename **filename, void *argv, void *envp, int *flags) {}
__attribute__((weak)) int ksu_security_context_to_sid(void *scontext, u32 slen, u32 *sid) { return -1; }
__attribute__((weak)) int ksu_security_sid_to_context(u32 sid, void **scontext, u32 *slen) { return -1; }
__attribute__((weak)) int ksu_security_context_str_to_sid(void *scontext, u32 *sid) { return -1; }
__attribute__((weak)) int ksu_security_compute_av_user(u32 ssid, u32 tsid, u16 tclass, u32 requested, void *avd) { return -1; }
#endif
"""
            if "__KSU_ALL_WEAK_DEFS_H__" not in rc:
                rc = hooks_fallback + rc
            with open(pr, "w") as fh: fh.write(rc)

        print("[+] All hooks and missing symbols safely patched with weak fallbacks!")
        '
        echo "[+] KittiSU integrated and fully patched!"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -Wno-unknown-warning-option -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" -j$(nproc) || make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KittiSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KittiSU-4.19-Zip
        path: A04-KittiSU-AnyKernel3.zip
