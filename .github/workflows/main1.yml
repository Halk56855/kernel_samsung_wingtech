name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - KittiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clean Integration of KittiSU via Submodule (Zero Core File Modification)
      run: |
        echo "[-] Cleaning up old remnants..."
        rm -rf drivers/kernelsu KittiSU .git/modules/KittiSU

        echo "[-] Adding KittiSU repository as a proper git submodule..."
        git submodule add -b testing https://github.com/terebiko/KittiSU.git KittiSU
        git submodule update --init --recursive

        echo "[-] Neutralizing KittiSU strict checks..."
        find KittiSU -name "*.mk" -exec truncate -s 0 {} \; || true

        echo "[-] Patching KittiSU Kbuild to accept direct directory link..."
        python3 -c '
        import os
        for root, dirs, files in os.walk("KittiSU"):
            for f in files:
                if f == "Kbuild":
                    fp = os.path.join(root, f)
                    with open(fp, "r") as fh: content = fh.read()
                    content = content.replace("error You should use KittiSU as a git submodule", "warning Submodule check bypassed")
                    content = content.replace("error Can\x27t find KittiSU git submodule", "warning Submodule path bypassed")
                    with open(fp, "w") as fh: fh.write(content)
        '

        echo "[-] Patching selinux_hide.c for Samsung 4.19 avc_has_perm argument compatibility..."
        python3 -c '
        import os
        for root, dirs, files in os.walk("KittiSU"):
            for f in files:
                if f == "selinux_hide.c":
                    fp = os.path.join(root, f)
                    with open(fp, "r") as fh: content = fh.read()
                    content = content.replace("avc_has_perm(current_sid()", "avc_has_perm(&selinux_state, current_sid()")
                    content = content.replace("avc_has_perm(mysid", "avc_has_perm(&selinux_state, mysid")
                    with open(fp, "w") as fh: fh.write(content)
        '

        echo "[-] Robust patching of SELinux definitions and current_sid guard for Samsung 4.19..."
        python3 -c '
        import os
        for root, dirs, files in os.walk("KittiSU"):
            for f in files:
                if f == "selinux_defs.h":
                    fp = os.path.join(root, f)
                    with open(fp, "w") as fh:
                        fh.write("#ifndef __KSU_SELINUX_DEFS_H\n")
                        fh.write("#define __KSU_SELINUX_DEFS_H\n")
                        fh.write("#include <security/selinux/include/security.h>\n")
                        fh.write("extern struct selinux_state selinux_state;\n")
                        fh.write("#define __is_selinux_enforcing() (selinux_state.enforcing)\n")
                        fh.write("#define __setenforce(val) (selinux_state.enforcing = val)\n")
                        fh.write("#define is_selinux_disabled() (selinux_state.disabled)\n")
                        fh.write("#endif\n")
                    print(f"[+] Overwritten {fp} with safe Samsung 4.19 definitions")

                if f == "selinux.c":
                    fp = os.path.join(root, f)
                    with open(fp, "r") as fh: content = fh.read()
                    if "static inline u32 current_sid(void)" in content:
                        content = content.replace("static inline u32 current_sid(void)", "#ifndef current_sid\nstatic inline u32 current_sid(void)\n#endif")
                    with open(fp, "w") as fh: fh.write(content)
                    print(f"[+] Patched {fp} for current_sid guard")
        '

        echo "[-] Linking KittiSU kernel folder to drivers/kernelsu..."
        python3 -c '
        import os, shutil
        ksu_src = None
        for root, dirs, files in os.walk("KittiSU"):
            if "Kconfig" in files:
                ksu_src = root
                break
        
        print(f"[+] Found Kconfig in: {ksu_src}")
        if not ksu_src:
            raise Exception("[-] Error: Kconfig not found inside KittiSU repository!")

        if os.path.islink("drivers/kernelsu") or os.path.exists("drivers/kernelsu"):
            if os.path.islink("drivers/kernelsu"):
                os.unlink("drivers/kernelsu")
            else:
                shutil.rmtree("drivers/kernelsu")

        os.symlink(os.path.relpath(ksu_src, "drivers"), "drivers/kernelsu")
        print("[+] Symlink drivers/kernelsu created successfully pointing to", ksu_src)
        '

        echo "[-] Wiring Kconfig and Makefile safely..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

        echo "[-] Ensuring clean makefiles for KittiSU..."
        python3 -c '
        import os, re
        for r, ds, fs in os.walk("drivers/kernelsu"):
            for f in fs:
                if f in ("Makefile", "Kbuild") or f.endswith(".mk"):
                    fp = os.path.join(r, f)
                    with open(fp, "r") as fh: c = fh.read()
                    c = re.sub(r"obj-\$\([^)]+\)", "obj-y", c)
                    c = re.sub(r"obj-\$[A-Za-z0-9_]+", "obj-y", c)
                    with open(fp, "w") as fh: fh.write(c)
        '
        echo "[+] KittiSU successfully integrated and fully patched for Samsung 4.19!"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) || make -C $(pwd) O=$(pwd)/out -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KittiSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KittiSU-4.19-Zip
        path: A04-KittiSU-AnyKernel3.zip
