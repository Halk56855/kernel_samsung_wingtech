name: Build Galaxy A04 Kernel with KittiSU & AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Clone Clang Toolchain (r383902)
        run: |
          mkdir -p toolchain/clang/host/linux-x86
          git clone --depth=1 https://github.com/afaneh-toolchain/prebuilts_clang_host_linux-x86_clang-r383902 toolchain/clang/host/linux-x86/clang-r383902

      - name: Setup Clang Toolchain & Fix ld.lld Path
        run: |
          TOOLCHAIN_DIR="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902"
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          if command -v ld.lld &> /dev/null; then
              echo "تم العثور على ld.lld بنجاح!"
          else
              echo "خطأ: أداة ld.lld غير موجودة في المسار المحدد!"
              exit 1
          fi

      - name: Setup KittiSU via Curl Script
        run: |
          curl -LSs "https://raw.githubusercontent.com/anotheranhiutangerine/KittiSU/main/kernel/setup.sh" | bash

      - name: Setup Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Configure Kernel Defconfig
        run: |
          mkdir -p out
          make O=out mrproper
          make O=out rsuntk-a04_defconfig

      - name: Inject KittiSU Options
        run: |
          scripts/config --file out/.config \
              -e KSU \
              -e KPROBES \
              -e HAVE_KPROBES \
              -e KALLSYMS \
              -e KALLSYMS_ALL
          make O=out olddefconfig

      - name: Compile Kernel
        run: |
          make -j$(nproc --all) O=out \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3-a04
        run: |
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Galaxy-A04-KittiSU-Kernel.zip * -x ".git*" README.md

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-KittiSU-Flashable-Zip
          path: Galaxy-A04-KittiSU-Kernel.zip
