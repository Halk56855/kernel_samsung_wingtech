name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19 - KittiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrate KittiSU & Proper Wiring
      run: |
        echo "[-] Cleaning up old KittiSU remnants..."
        rm -rf drivers/kernelsu
        rm -rf KittiSU

        echo "[-] Cloning KittiSU repository..."
        git clone https://github.com/terebiko/KittiSU.git KittiSU -b testing

        echo "[-] Neutralizing KittiSU integration check scripts for Non-GKI environment..."
        find KittiSU/kernel/tools -name "*.mk" -exec truncate -s 0 {} \; || true

        echo "[-] Establishing correct symbolic link for drivers/kernelsu..."
        if [ -d "KittiSU/kernel" ]; then
          ln -sf ../KittiSU/kernel drivers/kernelsu
        else
          ln -sf ../KittiSU drivers/kernelsu
        fi

        echo "[-] Safely wiring Kconfig and Makefile..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

        echo "[-] Applying comprehensive Python patches for Samsung 4.19 SELinux, policydb & forced obj-y compilation..."
        python3 - << 'EOF'
        import os
        import re

        # 1. Force all Makefiles and Kbuild files under drivers/kernelsu to compile unconditionally (obj-y)
        for root, dirs, files in os.walk("drivers/kernelsu"):
            for file in files:
                if file == "Makefile" or file == "Kbuild" or file.endswith(".mk"):
                    filepath = os.path.join(root, file)
                    with open(filepath, "r") as f:
                        mk_code = f.read()
                    mk_code = re.sub(r'obj-\$\([^)]+\)', 'obj-y', mk_code)
                    mk_code = re.sub(r'obj-\$[A-Za-z0-9_]+', 'obj-y', mk_code)
                    with open(filepath, "w") as f:
                        f.write(mk_code)
                    print(f"[+] Forced obj-y in {filepath}")

        # 2. Patch all avc_has_perm calls and fix macro definitions across KittiSU files
        for root, dirs, files in os.walk("drivers/kernelsu"):
            for file in files:
                if file.endswith(".c") or file.endswith(".h"):
                    filepath = os.path.join(root, file)
                    with open(filepath, "r") as f:
                        code = f.read()
                    
                    modified = False
                    if "avc_has_perm" in code:
                        def patch_avc(match):
                            args = match.group(1)
                            if "&selinux_state" not in args:
                                return f"avc_has_perm(&selinux_state, {args})"
                            return match.group(0)
                        
                        code = re.sub(r'avc_has_perm\s*\(([^)]+)\)', patch_avc, code)
                        modified = True

                    if "is_selinux_disabled" in code:
                        code = re.sub(r'#define\s+is_selinux_disabled\s*\([^)]*\).*', '#define is_selinux_disabled() 0', code)
                        modified = True

                    if modified:
                        with open(filepath, "w") as f:
                            f.write(code)

        # 3. Patch selinux.c for selinux_enforcing and current_sid redefinition resolution
        path_selinux = "drivers/kernelsu/selinux/selinux.c"
        if os.path.exists(path_selinux):
            with open(path_selinux, "r") as f:
                code = f.read()
            
            if "extern int selinux_enforcing;" not in code:
                code = "extern int selinux_enforcing;\n" + code
                
            if "static inline u32 current_sid(void)" in code:
                code = code.replace("static inline u32 current_sid(void)", "static inline u32 ksu_current_sid(void)")
                code = code.replace("current_sid()", "ksu_current_sid()")
                
            with open(path_selinux, "w") as f:
                f.write(code)

        # 4. Patch rules.c for selinux_status_update_policyload and policydb declaration
        path_rules = "drivers/kernelsu/selinux/rules.c"
        if os.path.exists(path_rules):
            with open(path_rules, "r") as f:
                rules_code = f.read()
            
            rules_code = rules_code.replace("selinux_status_update_policyload(0)", "selinux_status_update_policyload(&selinux_state, 0)")
            rules_code = rules_code.replace("selinux_status_update_policyload( 0 )", "selinux_status_update_policyload(&selinux_state, 0)")
            
            if "extern struct policydb policydb;" not in rules_code:
                rules_code = "extern struct policydb policydb;\n" + rules_code
                
            with open(path_rules, "w") as f:
                f.write(rules_code)

        # 5. Export policydb and selinux_enforcing globally in kernel SELinux source code
        for root, dirs, files in os.walk("security/selinux"):
            for file in files:
                if file.endswith(".c"):
                    filepath = os.path.join(root, file)
                    with open(filepath, "r") as f:
                        sec_code = f.read()
                    
                    modified = False
                    if "struct policydb policydb" in sec_code and "static" in sec_code:
                        sec_code = sec_code.replace("static struct policydb policydb", "struct policydb policydb")
                        modified = True
                    if "int selinux_enforcing" in sec_code and "static" in sec_code:
                        sec_code = sec_code.replace("static int selinux_enforcing", "int selinux_enforcing")
                        modified = True
                        
                    if modified:
                        with open(filepath, "w") as f:
                            f.write(sec_code)
                        print(f"[+] Successfully exported symbols in {filepath}")

        print("[+] Python precise patching & exporting completed successfully!")
        EOF
        
        echo "[+] KittiSU integrated and fully patched!"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -Wno-unknown-warning-option -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_KPROBE_HOOKS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DISABLE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" -j$(nproc) || make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include" -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-KittiSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-KittiSU-4.19-Zip
        path: A04-KittiSU-AnyKernel3.zip
