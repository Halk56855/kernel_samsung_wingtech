name: Build Kernel Samsung Wingtech A04 (YukiSU 4.19)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrate YukiSU & Ultimate Kernel 4.19 Compatibility Patcher (No KPM, No SuSFS)
      run: |
        echo "[-] Cleaning up old KernelSU/YukiSU remnants..."
        rm -rf drivers/kernelsu
        rm -rf YukiSU

        echo "[-] Cloning Anatdx YukiSU repository..."
        git clone https://github.com/Anatdx/YukiSU.git YukiSU -b main

        echo "[-] Applying advanced Python patch for Kernel 4.19 (Disabling KPM, SuSFS, force_sig & all 4.19 compatibility fixes)..."
        python3 -c '
        import os, re
        ns_count = 0
        twa_count = 0
        seccomp_count = 0
        pgtable_count = 0
        fsnotify_count = 0
        forcesig_count = 0
        
        for root, dirs, files in os.walk("YukiSU"):
            for file in files:
                if file.endswith((".c", ".h", "Kconfig", "Makefile")):
                    path = os.path.join(root, file)
                    with open(path, "r", encoding="utf-8", errors="ignore") as f:
                        content = f.read()
                    
                    # 1. Neutralize MODULE_IMPORT_NS
                    new_content = re.sub(r"MODULE_IMPORT_NS\s*\([^)]*\)\s*;?", "// [Compat-4.19] MODULE_IMPORT_NS removed", content)

                    # 2. Fix task_work_add by replacing TWA flags with true
                    content2 = new_content
                    new_content = re.sub(r"task_work_add\s*\(([^,]+),\s*([^,]+),\s*TWA_[A-Z_]+\s*\)", r"task_work_add(\1, \2, true)", content2)

                    # 3. Neutralize seccomp.filter_count lines safely
                    lines = new_content.splitlines()
                    new_lines = []
                    seccomp_modified = False
                    for line in lines:
                        if "seccomp.filter_count" in line:
                            new_lines.append("    // [Compat-4.19] seccomp.filter_count omitted")
                            seccomp_count += 1
                            seccomp_modified = True
                        else:
                            new_lines.append(line)
                    
                    if seccomp_modified:
                        new_content = "\n".join(new_lines) + "\n"

                    # 4. Map linux/pgtable.h to asm/pgtable.h for 4.19 compatibility
                    content3 = new_content
                    new_content = re.sub(r"#include\s+<linux/pgtable\.h>", "#include <asm/pgtable.h>", content3)
                    if new_content != content3:
                        pgtable_count += 1

                    # 5. Map handle_inode_event to handle_event for fsnotify_ops in Kernel 4.19
                    content4 = new_content
                    new_content = re.sub(r"\.handle_inode_event\s*=", ".handle_event =", content4)
                    if new_content != content4:
                        fsnotify_count += 1

                    # 6. Fix force_sig single argument to (SIG, current) for 4.19
                    content5 = new_content
                    new_content = re.sub(r"\bforce_sig\s*\(\s*([A-Z_]+)\s*\)", r"force_sig(\1, current)", content5)
                    if new_content != content5:
                        forcesig_count += 1

                    if new_content != content:
                        with open(path, "w", encoding="utf-8") as f:
                            f.write(new_content)
                        print(f"Successfully patched: {path}")

        print(f"Total MODULE_IMPORT_NS neutralized: {ns_count}")
        print(f"Total task_work_add fixed for 4.19: {twa_count}")
        print(f"Total seccomp.filter_count omitted for 4.19: {seccomp_count}")
        print(f"Total pgtable.h includes mapped to asm/pgtable.h: {pgtable_count}")
        print(f"Total handle_inode_event mapped to handle_event: {fsnotify_count}")
        print(f"Total force_sig fixed for 4.19: {forcesig_count}")
        '

        echo "[-] Establishing correct symbolic link for drivers/kernelsu..."
        if [ -d "YukiSU/kernel" ]; then
          ln -sf ../YukiSU/kernel drivers/kernelsu
        else
          ln -sf ../YukiSU drivers/kernelsu
        fi

        echo "[-] Safely wiring Kconfig and Makefile..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi
        
        echo "[+] YukiSU integrated and fully patched for Kernel 4.19 (No KPM, No SuSFS)!"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -Wno-unknown-warning-option" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        # Disable IKHEADERS and explicitly disable KPM and SuSFS
        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_SUSFS=n
        CONFIG_KPM=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option" -j$(nproc) || make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option" -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-YukiSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-YukiSU-4.19-Zip
        path: A04-YukiSU-AnyKernel3.zip
