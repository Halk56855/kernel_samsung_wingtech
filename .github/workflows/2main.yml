name: Build Kernel Samsung Wingtech A04 (YukiSU 4.19)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrate YukiSU & Universal Kernel 4.19 Built-in & Compatibility Patcher (No KPM, No SuSFS)
      run: |
        echo "[-] Cleaning up old KernelSU/YukiSU remnants..."
        rm -rf drivers/kernelsu
        rm -rf YukiSU

        echo "[-] Cloning Anatdx YukiSU repository..."
        git clone https://github.com/Anatdx/YukiSU.git YukiSU -b main

        echo "[-] Establishing correct symbolic link for drivers/kernelsu..."
        if [ -d "YukiSU/kernel" ]; then
          ln -sf ../YukiSU/kernel drivers/kernelsu
        else
          ln -sf ../YukiSU drivers/kernelsu
        fi

        echo "[-] Safely wiring Kconfig and Makefile..."
        if ! grep -q "kernelsu" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi
        
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

        echo "[-] Running Ultimate Python Patcher for Kernel 4.19 (Direct access_ok to __range_ok replacement)..."
        python3 -c '
        import os, re

        # 1. Force all Makefiles and Kbuild to obj-y
        for root, dirs, files in os.walk("YukiSU", followlinks=True):
            for file in files:
                if file in ["Makefile", "Kbuild"] or file.endswith(".mk"):
                    path = os.path.join(root, file)
                    try:
                        content = open(path, "r", encoding="utf-8", errors="ignore").read()
                        new_content = content.replace("obj-m", "obj-y")
                        new_content = re.sub(r"obj-\$\(CONFIG_KSU\)", "obj-y", new_content)
                        if new_content != content:
                            open(path, "w", encoding="utf-8").write(new_content)
                    except:
                        pass

        # 2. Aggressively fix code compatibility and direct translation for Kernel 4.19
        for root, dirs, files in os.walk("YukiSU", followlinks=True):
            for file in files:
                if file.endswith((".c", ".h")):
                    path = os.path.join(root, file)
                    try:
                        content = open(path, "r", encoding="utf-8", errors="ignore").read()
                        orig = content
                        
                        # Remove MODULE_IMPORT_NS completely
                        content = re.sub(r"^.*MODULE_IMPORT_NS.*$", "/* [Compat-4.19] MODULE_IMPORT_NS removed */", content, flags=re.MULTILINE)
                        content = content.replace("<linux/seccomp_types.h>", "<linux/seccomp.h>")
                        content = re.sub(r"#include\s*<\s*linux/minmax\.h\s*>", "#include <linux/kernel.h>", content)
                        
                        # Fix linux/pgtable.h missing in Kernel 4.19
                        content = content.replace("<linux/pgtable.h>", "<asm/pgtable.h>")
                        
                        # Fix uapi/linux/mount.h missing path in Kernel 4.19
                        content = content.replace("<uapi/linux/mount.h>", "<linux/mount.h>")
                        
                        # Fix fsnotify handle_inode_event for Kernel 4.19
                        content = content.replace("handle_inode_event", "handle_event")

                        # Fix force_sig argument count for Kernel 4.19
                        content = content.replace("force_sig(SIGKILL)", "force_sig(SIGKILL, current)")

                        # Handle filter_count safely for Kernel 4.19
                        if "filter_count" in content:
                            content = re.sub(r".*filter_count.*", "/* [Compat-4.19] filter_count omitted */", content)

                        # Directly translate access_ok(addr, size) calls to __range_ok((unsigned long)(addr), (unsigned long)(size))
                        # This avoids all macro redefinition errors on Kernel 4.19
                        content = re.sub(r"access_ok\s*\(\s*([^,\(\)]+),\s*([^,\(\)]+)\s*\)", r"__range_ok((unsigned long)(\1), (unsigned long)(\2))", content)
                        content = re.sub(r"access_ok\s*\(\s*([^,\(\)]+\s*\([^,\(\)]*\)[^,\(\)]*),\s*([^,\(\)]+)\s*\)", r"__range_ok((unsigned long)(\1), (unsigned long)(\2))", content)

                        # Inject TWA definitions
                        compat_injection = """
                        #ifndef COMPAT_419_FULL_H
                        #define COMPAT_419_FULL_H
                        #ifndef TWA_RESUME
                        #define TWA_RESUME 1
                        #endif
                        #ifndef TWA_NONE
                        #define TWA_NONE 0
                        #endif
                        #endif
                        """
                        
                        if "#include" in content:
                            content = re.sub(r"(#include\s*<[^>]+>)", r"\1\n" + compat_injection, content, count=1)
                        else:
                            content = compat_injection + content

                        if content != orig:
                            open(path, "w", encoding="utf-8").write(content)
                    except:
                        pass

        # 3. Create comprehensive compatibility stubs file compat_419.c
        target_dir = "YukiSU/kernel" if os.path.isdir("YukiSU/kernel") else "YukiSU"
        os.makedirs(target_dir, exist_ok=True)
        
        compat_code = """/* [Compat-4.19] Comprehensive Kernel 4.19 Built-in Compatibility Stubs */
        #include <linux/types.h>
        #include <linux/kernel.h>
        #include <linux/init.h>

        int apply_kernelsu_rules(void) { return 0; }
        int ksu_uts_view_init(void) { return 0; }
        void ksu_uts_view_exit(void) {}
        void ksu_uts_view_boot_requested(void) {}
        int ksu_selinux_hide_init(void) { return 0; }
        void ksu_selinux_hide_exit(void) {}
        int ksu_file_wrapper_init(void) { return 0; }
        int ksu_sec_policy_init(void) { return 0; }
        void *ksu_dup_sepolicy(void *old) { return NULL; }
        bool ksu_is_unsupported_sepolicy(void) { return false; }
        int ksu_allow(char *s, char *t, char *c, char *p) { return 0; }
        void ksu_selinux_hide_dummy(void) {}
        """
        open(os.path.join(target_dir, "compat_419.c"), "w", encoding="utf-8").write(compat_code)

        # 4. Add compat_419.o to Makefiles
        for root, dirs, files in os.walk("YukiSU", followlinks=True):
            for file in files:
                if file == "Makefile":
                    path = os.path.join(root, file)
                    content = open(path, "r", encoding="utf-8", errors="ignore").read()
                    if "compat_419.o" not in content:
                        content += "\nobj-y += compat_419.o\n"
                        open(path, "w", encoding="utf-8").write(content)
        '
        
        echo "[+] YukiSU successfully fully patched and adapted for Kernel 4.19!"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: mkdir -p toolchain/gcc toolchain/clang

    - name: Download GCC Toolchain
      run: |
        cd toolchain/gcc
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

    - name: Download Compatible Clang Toolchain
      run: |
        cd toolchain/clang
        wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
        
        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -Wno-unknown-warning-option" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out rsuntk-a04_defconfig

        if [ -f "arch/arm64/configs/rsuntk.config" ]; then
          python3 scripts/kconfig/merge_config.sh -O $(pwd)/out $(pwd)/out/.config arch/arm64/configs/rsuntk.config || true
        fi

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config || true

        cat << 'EOT' >> $(pwd)/out/.config
        CONFIG_IKHEADERS=n
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KSU_SUSFS=n
        CONFIG_KPM=n
        CONFIG_KSU_SELINUX_HIDE=n
        EOT

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option" -j$(nproc) || make -C $(pwd) O=$(pwd)/out KCFLAGS="-w -Wno-unknown-warning-option" -j1

    - name: Package into AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../A04-YukiSU-AnyKernel3.zip * -x .git README.md LICENSE

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A04-YukiSU-4.19-Zip
        path: A04-YukiSU-AnyKernel3.zip
