name: Build Kernel Samsung Wingtech A04 (Non-GKI 4.19)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel Branch / Tag'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            git \
            python3 \
            wget \
            cpio \
            unzip \
            gcc-11-aarch64-linux-gnu \
            g++-11-aarch64-linux-gnu \
            gcc-11-arm-linux-gnueabi \
            g++-11-arm-linux-gnueabi

      - name: Fix vDSO Dynamic Relocation Error for Modern Compilers
        run: |
          # حقن معاملات لمنع المترجم من توليد مكتبات خارجية داخل الـ vDSO
          VDSO_MAKEFILE="arch/arm64/kernel/vdso/Makefile"
          if [ -f "$VDSO_MAKEFILE" ]; then
            echo "Patching $VDSO_MAKEFILE to support modern build environments..."
            sed -i 's/-shared/-shared -fno-builtin-memcpy -fno-builtin-memset -ffreestanding/g' "$VDSO_MAKEFILE"
          else
            echo "Warning: vDSO Makefile path not found, skipping patch."
          fi

      - name: Configure Build Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc-11" >> $GITHUB_ENV

      - name: Setup Kernel Configuration (Defconfig)
        run: |
          mkdir -p out
          # استبدل wingtech_defconfig باسم ملف التكوين (Defconfig) الخاص بجهازك
          make O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc-11 CROSS_COMPILE=aarch64-linux-gnu- defconfig

      - name: Build Kernel Image & Modules
        run: |
          # بدء عملية البناء مستخدماً جميع أنوية المعالج المتاحة في السيرفر (-jN)
          make O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc-11 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Samsung-Wingtech-A04-ReSukiSU
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/*.dtb
            out/arch/arm64/boot/dt.img
